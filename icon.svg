<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Sound waves (left) -->
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <path d="M150 256 Q150 200 200 185"/>
    <path d="M130 256 Q130 175 200 155" opacity="0.6"/>
  </g>
  <!-- Sound waves (right) -->
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <path d="M362 256 Q362 200 312 185"/>
    <path d="M382 256 Q382 175 312 155" opacity="0.6"/>
  </g>
  <!-- Microphone -->
  <g filter="url(#shadow)">
    <!-- Mic capsule -->
    <rect x="232" y="168" width="48" height="96" rx="24" fill="#f8fafc"/>
    <!-- Mic grille lines -->
    <line x1="244" y1="188" x2="268" y2="188" stroke="#cbd5e1" stroke-width="1.5" opacity="0.5"/>
    <line x1="244" y1="200" x2="268" y2="200" stroke="#cbd5e1" stroke-width="1.5" opacity="0.5"/>
    <line x1="244" y1="212" x2="268" y2="212" stroke="#cbd5e1" stroke-width="1.5" opacity="0.5"/>
    <line x1="244" y1="224" x2="268" y2="224" stroke="#cbd5e1" stroke-width="1.5" opacity="0.5"/>
    <!-- Mic arc -->
    <path d="M210 256 Q210 310 256 310 Q302 310 302 256" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <!-- Stand -->
    <line x1="256" y1="310" x2="256" y2="352" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <line x1="226" y1="352" x2="286" y2="352" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Accent dot -->
  <circle cx="256" cy="168" r="6" fill="url(#accent)"/>
</svg>
