<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="广东高考英语听说练习软件 - 内置高考真题，模拟考试练习">
<title>广东高考英语听说</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{
  --primary:#3b82f6;--primary-dark:#1e40af;--primary-light:#dbeafe;--primary-bg:#eff6ff;
  --bg:#f1f5f9;--bg-card:#ffffff;--bg-secondary:#f1f5f9;--bg-tertiary:#f8fafc;
  --text:#0f172a;--text-secondary:#64748b;--text-tertiary:#94a3b8;
  --border:#e2e8f0;--border-light:#f1f5f9;
  --danger:#ef4444;--warning:#f59e0b;--success:#22c55e;
  --score-high:#3b82f6;--score-mid:#f59e0b;--score-low:#ef4444;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.03),0 4px 12px rgba(0,0,0,.03);--shadow-hover:0 4px 20px rgba(0,0,0,.06);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px}
.app{max-width:680px;margin:0 auto;padding:14px 14px calc(86px + var(--safe-bottom));min-height:100vh}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--text-secondary);font-size:13px}
.card{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;transition:transform .12s,box-shadow .15s;display:inline-block;box-shadow:0 2px 8px rgba(59,130,246,.2)}
.primary:active{transform:scale(.97)}
.primary:disabled{opacity:.55;cursor:not-allowed}
.smallBtn{background:var(--bg-secondary);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;border:1px solid var(--border);transition:all .15s;display:inline-block}
.smallBtn:active{transform:scale(.96)}
.dangerGhost{background:transparent;border:1px solid #fecaca;color:var(--danger)}
.ghostBtn{background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;transition:all .15s;display:inline-block}
.ghostBtn:active{transform:scale(.96)}
.fullWidth{width:100%;text-align:center}
.status{color:var(--text-secondary);font-size:13px;background:var(--bg-secondary);border-radius:10px;padding:8px 12px;margin-top:8px;word-break:break-all}
.topBar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.topBar h1{font-size:22px}
.versionPill{background:var(--primary-light);color:var(--primary-dark);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.heroBanner{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#1e3a5f 100%);border-radius:18px;padding:24px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(15,23,42,.25)}
.heroBanner h2{color:#fff;font-size:22px;margin-bottom:4px;font-weight:800;letter-spacing:-.01em}
.heroBanner p{opacity:.8;font-size:13px;margin-bottom:12px}
.heroStats{display:flex;gap:16px}
.heroStat{text-align:center}
.heroStat .hv{font-size:22px;font-weight:800}
.heroStat .hl{font-size:11px;opacity:.85}
.modeCard{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s;margin-bottom:10px}
.modeCard:active{transform:scale(.99);box-shadow:var(--shadow-hover)}
.modeCard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px}
.modeMock::before{background:linear-gradient(180deg,#f59e0b,#d97706)}
.modeRandom::before{background:linear-gradient(180deg,#8b5cf6,#7c3aed)}
.modeA::before{background:linear-gradient(180deg,#3b82f6,#2563eb)}
.modeB::before{background:linear-gradient(180deg,#8b5cf6,#7c3aed)}
.modeC::before{background:linear-gradient(180deg,#10b981,#059669)}
.modeQuestion::before{background:linear-gradient(180deg,#6366f1,#4f46e5)}
.modeHead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.modeIcon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:#fff;flex-shrink:0}
.modeMock .modeIcon{background:linear-gradient(135deg,#f59e0b,#d97706)}
.modeRandom .modeIcon{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.modeA .modeIcon{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.modeB .modeIcon{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.modeC .modeIcon{background:linear-gradient(135deg,#10b981,#059669)}
.modeTitle{font-size:16px;font-weight:600}
.modeSub{color:var(--text-secondary);font-size:12px}
.modeMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{background:var(--bg-secondary);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--text-secondary)}
.tag.score{background:#dcfce7;color:#166534}
.tag.diff-easy{background:#dcfce7;color:#166534}
.tag.diff-medium{background:#fef3c7;color:#92400e}
.tag.diff-hard{background:#fee2e2;color:#991b1b}
.tag.src-real{background:#dbeafe;color:#1d4ed8}
.tag.src-mock{background:#f3f4f6;color:#6b7280}
.diffFilter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.diffChip{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);transition:all .15s}
.diffChip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.srcFilter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.resListItem{background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:transform .12s}
.resListItem:active{transform:scale(.99)}
.resListIcon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff;flex-shrink:0}
.resListBody{flex:1;min-width:0}
.resListTitle{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resListSub{font-size:12px;color:var(--text-secondary)}
.resListDone{width:24px;height:24px;border-radius:50%;background:#dcfce7;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.srcLabel{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin-top:4px}
.srcLabel.real{background:#dbeafe;color:#1d4ed8}
.srcLabel.mock{background:#f3f4f6;color:#6b7280}
.examWrap{background:var(--bg-card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.phaseBar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.phaseDot{flex:1;min-width:60px;text-align:center;font-size:11px;color:var(--text-tertiary);padding:6px 4px;border-radius:10px;background:var(--bg-secondary);font-weight:600}
.phaseDot.active{background:var(--primary);color:#fff}
.phaseDot.done{background:#dcfce7;color:#166534}
.examTitle{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timer{background:#fef3c7;color:#92400e;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.passage{background:var(--bg-tertiary);border-radius:12px;padding:16px;font-size:17px;line-height:2;letter-spacing:.01em}
.keywordRow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.kw{background:var(--primary-bg);color:var(--primary-dark);border:1px solid #bfdbfe;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.kw small{color:var(--text-secondary);font-weight:400;margin-left:4px}
.qaBlock{background:var(--bg-tertiary);border-radius:12px;padding:14px;margin:10px 0}
.qaBlock .qlabel{font-size:12px;color:var(--text-tertiary);font-weight:700;margin-bottom:4px}
.qaBlock .qtext{font-size:15px;font-weight:600;margin-bottom:6px}
.qaBlock .atext{font-size:14px;color:var(--text-secondary)}
.cnPrompt{background:#fffbeb;border-left:3px solid var(--warning);border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0}
.recBar{display:flex;align-items:center;gap:12px;background:var(--bg-secondary);border-radius:14px;padding:12px 14px;margin-top:14px}
.recDot{width:14px;height:14px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.recBar.recording{background:#fef2f2}
.resultBox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:12px}
.resultBox.warn{background:#fffbeb;border-color:#fde68a}
.resultBox.fail{background:#fef2f2;border-color:#fecaca}
.scoreBig{font-size:36px;font-weight:800;color:var(--success)}
.scoreBig.warn{color:var(--warning)}
.scoreBig.fail{color:var(--danger)}
.scoreGrade{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px}
.scoreGrade.high{background:#dbeafe;color:#1d4ed8}
.scoreGrade.mid{background:#fef3c7;color:#92400e}
.scoreGrade.low{background:#fee2e2;color:#991b1b}
.dimRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.dimCard{background:#fff;border-radius:10px;padding:10px;text-align:center}
.dimCard .dv{font-size:20px;font-weight:800}
.dimCard .dv.high{color:var(--score-high)}
.dimCard .dv.mid{color:var(--score-mid)}
.dimCard .dv.low{color:var(--score-low)}
.dimCard .dl{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.dimBar{height:6px;border-radius:3px;background:var(--bg-secondary);margin-top:6px;overflow:hidden}
.dimBarFill{height:100%;border-radius:3px;transition:width .5s}
.audioBtn{display:inline-flex;align-items:center;gap:6px;background:var(--primary-bg);color:var(--primary-dark);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid #bfdbfe}
.audioBtn:active{transform:scale(.96)}
.audioBtn.playing{background:var(--primary);color:#fff}
.audioBtn:disabled{opacity:.5}
.btnRow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btnRow .primary{flex:1;text-align:center}
.transcript{background:var(--bg-tertiary);border-radius:10px;padding:12px;font-size:13px;color:var(--text-secondary);margin-top:10px;max-height:160px;overflow-y:auto;line-height:1.7}
.missWords{margin-top:8px}
.missWords .mw{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px}
.errItem{background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.errItem .eiHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.errItem .eiPart{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.errItem .eiPart.A{background:#dbeafe;color:#1d4ed8}
.errItem .eiPart.B{background:#ede9fe;color:#6d28d9}
.errItem .eiPart.C{background:#d1fae5;color:#047857}
.errItem .eiTitle{font-size:14px;font-weight:600;margin-bottom:4px}
.errItem .eiDetail{font-size:13px;color:var(--text-secondary)}
.errItem .eiScore{font-size:13px;font-weight:700}
.chartBar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chartBar .cbLabel{width:60px;font-size:12px;color:var(--text-secondary);text-align:right;flex-shrink:0}
.chartBar .cbTrack{flex:1;height:24px;background:var(--bg-secondary);border-radius:8px;overflow:hidden;position:relative}
.chartBar .cbFill{height:100%;border-radius:8px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:700}
.chartBar .cbVal{width:36px;font-size:13px;font-weight:700;flex-shrink:0}
.meHeader{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.meAvatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2563eb);display:grid;place-items:center;font-size:26px;color:#fff;flex-shrink:0;box-shadow:0 4px 16px rgba(59,130,246,.25)}
.section{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.section h3{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-light)}
.row:last-child{border-bottom:none}
.row .rl{color:var(--text-secondary);font-size:14px}
.row .rv{font-weight:600;font-size:14px}
.cloudUpdateSection{background:var(--primary-bg);border:1px solid #bfdbfe;border-radius:18px;padding:14px;margin-bottom:12px;word-break:break-all;overflow:hidden}
.cloudUpdateSection h3{color:var(--primary-dark);font-size:16px;margin-bottom:6px}
.updateInfoBox{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;margin-top:10px;padding:12px;word-break:break-all;overflow:hidden}
.updateNewVersion{color:var(--primary);font-size:15px;font-weight:600;margin-bottom:6px}
.updateLog{color:var(--text-secondary);background:var(--bg);white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;border-radius:8px;margin:0;padding:8px;font-size:13px;font-family:inherit}
.updateLatest{color:var(--text-tertiary);font-weight:600}
.feedbackSec{background:#fffbeb;border:1px solid #fde68a;border-radius:18px;padding:14px;margin-bottom:12px}
.feedbackSec h3{color:#92400e;font-size:16px;margin-bottom:6px}
.statGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.statCard{background:var(--bg-card);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.statCard .sn{font-size:24px;font-weight:800;color:var(--primary)}
.statCard .sl{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.tabbar{position:fixed;left:50%;bottom:max(10px,var(--safe-bottom));transform:translateX(-50%);width:min(420px,calc(100vw - 16px));background:rgba(255,255,255,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(226,232,240,.6);border-radius:20px;padding:5px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;box-shadow:0 -2px 20px rgba(0,0,0,.03),0 8px 28px rgba(0,0,0,.05);z-index:50}
.tabbar button{color:var(--text-tertiary);background:transparent;border-radius:14px;padding:10px 2px;font-size:11px;display:grid;place-items:center;gap:2px;transition:all .2s;white-space:nowrap;overflow:hidden}
.tabbar button.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 2px 10px rgba(59,130,246,.3)}
.tabbar button.disabled{opacity:.4;pointer-events:auto}
.tabbar button.disabled:active{transform:none}
.tabIcon{width:22px;height:22px;display:flex;justify-content:center;align-items:center;line-height:1;font-size:20px}
.tabLabel{font-size:11px}
.updateOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1000;display:grid;place-items:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.updateModal{background:var(--bg-card);border-radius:20px;width:100%;max-width:400px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.3);animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.updateModalHeader{background:linear-gradient(135deg,#0f1525,#1a2236);color:#fff;text-align:center;padding:24px 20px 20px}
.updateModalIcon{font-size:40px;margin-bottom:8px}
.updateModalTitle{font-size:20px;font-weight:700;margin-bottom:4px}
.updateModalSub{font-size:13px;opacity:.9}
.updateModalVersion{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:20px;padding:6px 14px;font-size:15px;font-weight:700;margin-top:12px}
.updateModalBadge{background:#f59e0b;color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}
.updateModalBody{flex:1;padding:20px;overflow-y:auto}
.updateModalBody h4{color:var(--text-secondary);font-size:14px;font-weight:600;margin-bottom:12px}
.updateModalList{list-style:none;padding:0;margin:0}
.updateModalList li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:14px;line-height:1.6;border-bottom:1px solid var(--border-light)}
.updateModalList li:last-child{border-bottom:none}
.updateModalDot{background:var(--primary);border-radius:50%;width:6px;height:6px;flex-shrink:0;margin-top:8px}
.updateModalFooter{display:flex;gap:10px;padding:16px 20px 20px;border-top:1px solid var(--border-light)}
.updateBtnPrimary{flex:1;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;transition:transform .15s}
.updateBtnPrimary:active{transform:scale(.97)}
.updateBtnGhost{background:transparent;border:none;color:var(--text-secondary);border-radius:12px;padding:12px 16px;font-size:14px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-bottom));transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:2000;animation:fadeIn .2s;max-width:90vw;text-align:center}
/* 高考UI：视频播放区 */
.videoStage{background:#000;border-radius:14px;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.videoStage .vsOverlay{position:absolute;inset:0;background:linear-gradient(135deg,#0f172a,#1e3a5f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.videoStage .vsIcon{font-size:48px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.videoStage .vsLabel{color:#94a3b8;font-size:13px;font-weight:600}
.videoStage .vsSubtitles{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:16px;line-height:1.6;padding:0 20px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.videoStage.playing .vsOverlay{opacity:.3;transition:opacity .3s}
.videoStage .vsPlayBtn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;backdrop-filter:blur(8px);transition:all .2s;cursor:pointer}
.videoStage .vsPlayBtn:active{transform:scale(.9)}
.videoStage .vsProgress{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.15)}
.videoStage .vsProgressFill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
/* 高考UI：考试状态栏（参考E听说） */
.examStatusBar{background:linear-gradient(135deg,#0f1525,#1a2236);border-radius:12px;padding:12px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;box-shadow:0 2px 12px rgba(15,21,37,.15)}
.examStatusBar .esbStatus{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.examStatusBar .esbStatus .esbDot{width:10px;height:10px;border-radius:50%;background:#4ade80;animation:pulse 1.5s infinite}
.examStatusBar .esbStatus.recording .esbDot{background:#f87171}
.examStatusBar .esbTimer{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 14px;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.examStatusBar .esbTimer.warn{background:#f87171;animation:pulse 1s infinite}
/* 高考UI：双语指令提示 */
.bilingualPrompt{background:#fffbeb;border-left:4px solid var(--warning);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.bilingualPrompt .bpCn{font-size:14px;font-weight:600;color:#92400e;margin-bottom:4px}
.bilingualPrompt .bpEn{font-size:13px;color:#78350f;font-style:italic}
/* 高考UI：录音进度条 */
.recProgressBar{height:6px;border-radius:3px;background:var(--bg-secondary);margin-top:10px;overflow:hidden;position:relative}
.recProgressBarFill{height:100%;background:linear-gradient(90deg,#ef4444,#f87171);border-radius:3px;transition:width .3s;width:0%}
/* 纠错模块 */

.examDark .corrItem{background:#d4ead4;border-radius:10px;padding:12px;margin-bottom:8px;border-left:2px solid rgba(239,68,68,.4)}

.examDark .corrItem .ciLabel.wrong{background:rgba(239,68,68,.15);color:#ef4444}
.examDark .corrItem .ciLabel.right{background:rgba(76,175,80,.15);color:#2e7d32}
.examDark .corrItem .ciBody{margin-top:8px}
.examDark .corrItem .ciRow{display:flex;gap:6px;margin:4px 0;align-items:flex-start}
.examDark .corrItem .ciTag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;flex-shrink:0;margin-top:2px}
.examDark .corrItem .ciTag.your{background:rgba(239,68,68,.15);color:#ef4444}
.examDark .corrItem .ciTag.correct{background:rgba(76,175,80,.15);color:#2e7d32}
.examDark .corrItem .ciTag.tip{background:rgba(46,125,50,.15);color:#2e7d32}
.examDark .corrItem .ciText{font-size:13px;color:#1a3c1e;line-height:1.6}
.examDark .corrItem .ciError{background:rgba(239,68,68,.08);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;color:#ef4444;line-height:1.5}
.examDark .corrItem .ciTip{background:rgba(46,125,50,.08);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;color:#2e7d32;line-height:1.5;white-space:pre-line}
.examDark .corrItem .mw{display:inline-block;background:rgba(239,68,68,.12);color:#ef4444;padding:2px 8px;border-radius:6px;margin:2px;font-size:12px;font-weight:600}
.examDark .transcript{background:#d4ead4;border-radius:8px;padding:12px;font-size:13px;color:#3d6b40;margin-top:10px;line-height:1.7;max-height:160px;overflow-y:auto}
.examDark .cnPrompt{background:rgba(245,158,11,.08);border-left:2px solid rgba(245,158,11,.4);border-radius:8px;padding:12px 14px;font-size:14px;color:#1a3c1e;margin:8px 0}
.examDark .keywordRow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.examDark .kw{background:rgba(46,125,50,.1);color:#2e7d32;border:1px solid rgba(46,125,50,.2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.examDark .kw small{color:#4a7a4c;font-weight:400;margin-left:4px}
.examDark .qaBlock{background:#d4ead4;border-radius:10px;padding:14px;margin:10px 0}
.examDark .qaBlock .qlabel{font-size:11px;color:#4a7a4c;font-weight:600;margin-bottom:4px}
.examDark .qaBlock .qtext{font-size:15px;font-weight:500;color:#1a3c1e;margin-bottom:6px}
.examDark .qaBlock .atext{font-size:13px;color:#4a7a4c}
.examDark .examStatusPrompt{background:rgba(46,125,50,.08);border:1px solid rgba(46,125,50,.15);border-radius:10px;padding:12px 14px;font-size:14px;color:#2e7d32;text-align:center;margin:10px 0;font-weight:500}
.examDark .ghostBtn{background:transparent;color:#4a7a4c;border:1px solid rgba(46,125,50,.15);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500}
.examDark .smallBtn{background:#d4ead4;color:#1a3c1e;border:1px solid rgba(46,125,50,.1);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500}
.examDark .primary{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(46,125,50,.2)}
.examDark .submitBtn{background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(46,125,50,.2)}
.examDark .muted{color:#4a7a4c;font-size:13px}
.examDark .tag{background:#d4ead4;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;color:#4a7a4c}
.examDark .tag.diff-easy{background:rgba(76,175,80,.12);color:#2e7d32}
.examDark .tag.diff-medium{background:rgba(245,158,11,.12);color:#f59e0b}
.examDark .tag.diff-hard{background:rgba(239,68,68,.12);color:#ef4444}
.examDark .srcLabel{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin-top:4px}
.examDark .srcLabel.real{background:rgba(46,125,50,.12);color:#2e7d32}
.examDark .srcLabel.mock{background:rgba(107,114,128,.12);color:#6b7280}
.examDark .btnRow{display:flex;gap:10px;margin-top:12px}
.examDark .heroBanner{background:linear-gradient(135deg,#a8d8aa 0%,#81c784 100%);border-radius:14px;padding:20px;color:#1a3c1e;margin-bottom:14px}
.examDark .heroBanner h2{color:#1a3c1e;font-weight:700}
.examDark .heroBanner p{color:#2e6b30;opacity:.8}
.examDark audio{width:100%}
@media(max-width:380px){.examDark .dimRow{grid-template-columns:1fr 1fr}}
/* 高考UI：试音阶段 */
.soundCheckScreen{background:linear-gradient(135deg,#a8d8aa 0%,#81c784 50%,#66bb6a 100%);border-radius:14px;padding:28px 20px;color:#1a3c1e;text-align:center;margin-bottom:14px;box-shadow:0 4px 16px rgba(46,125,50,.2)}
.soundCheckScreen .scIcon{font-size:42px;margin-bottom:12px;opacity:.8}
.soundCheckScreen .scTitle{font-size:20px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
.soundCheckScreen .scSub{font-size:13px;color:#2e6b30;margin-bottom:16px}
.soundCheckText{background:rgba(255,255,255,.4);border-radius:10px;padding:18px;margin:12px 0;font-size:16px;line-height:1.8;letter-spacing:.02em}
.soundCheckText .cn{font-size:14px;color:#2e6b30;margin-top:8px}
.scTestRow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.scTestBtn{background:rgba(255,255,255,.3);color:#1a3c1e;border:1px solid rgba(46,125,50,.25);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .15s}
.scTestBtn:active{transform:scale(.96)}
.scTestBtn.ready{background:rgba(46,125,50,.15);color:#2e7d32;border-color:rgba(46,125,50,.3)}
.scMicDot{width:10px;height:10px;border-radius:50%;background:#f87171;animation:pulse 1.2s infinite}
.scMicDot.ready{background:#4ade80;animation:none}
/* 高考UI：倒计时 */
.countdownBig{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;color:var(--danger);letter-spacing:.02em}
.countdownMid{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--danger)}
.countdownLabel{text-align:center;font-size:13px;color:var(--text-secondary);margin-top:4px}
.examStatusPrompt{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:14px;color:#92400e;text-align:center;margin:10px 0;font-weight:600}
.examPhaseHeader{background:linear-gradient(135deg,#1e3a5f,#2563eb);border-radius:var(--radius);padding:16px 18px;color:#fff;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.examPhaseHeader .ephTitle{font-size:17px;font-weight:700}
.examPhaseHeader .ephSub{font-size:12px;opacity:.85;margin-top:2px}
.examPhaseHeader .ephTimer{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 14px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
/* 试题练习模式 */
.modeQuestion::before{background:#6366f1}
.modeQuestion .modeIcon{background:linear-gradient(135deg,#6366f1,#4f46e5)}
/* 评分说明与答题技巧 */
.guideSection{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.guideSection h3{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.guidePart{margin-bottom:14px}
.guidePart:last-child{margin-bottom:0}
.guidePartTitle{font-size:15px;font-weight:700;color:var(--primary-dark);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.guideScoreTable{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.guideScoreTable th{background:var(--bg-secondary);padding:6px 10px;text-align:left;font-weight:600;border-radius:6px}
.guideScoreTable td{padding:6px 10px;border-bottom:1px solid var(--border-light)}
.guideScoreTable td:last-child{text-align:right;font-weight:700}
.guideTip{background:var(--bg-tertiary);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-secondary);line-height:1.6;margin-top:6px;white-space:pre-line}
.guideTip strong{color:var(--text)}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.emptyState{text-align:center;padding:40px 20px;color:var(--text-tertiary)}
.emptyState .ei{font-size:48px;margin-bottom:10px}
@media(max-width:380px){.app{padding:10px}.dimRow{grid-template-columns:1fr 1fr}}
/* === E听说风格组件 === */
/* 数据栏 */
.etsDataBar{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:16px;padding:16px;color:#fff;margin-bottom:14px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 4px 20px rgba(102,126,234,.25)}
.etsDataItem{text-align:center;flex:1;cursor:pointer;transition:transform .15s}
.etsDataItem:active{transform:scale(.95)}
.etsDataItem .ediVal{font-size:24px;font-weight:800;letter-spacing:-.02em}
.etsDataItem .ediLabel{font-size:11px;opacity:.85;margin-top:2px}
.etsDataDivider{width:1px;height:32px;background:rgba(255,255,255,.2)}
/* 模块标题 */
.etsSectionTitle{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;padding:0 2px}
.etsSectionTitle h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.etsSectionTitle .etsMore{font-size:13px;color:var(--text-secondary);font-weight:500}
/* 模拟考试大卡片 */
.etsMockCard{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);border-radius:16px;padding:20px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(15,52,96,.25)}
.etsMockCard::after{content:"";position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);border-radius:50%}
.etsMockCard .mcIcon{font-size:32px;margin-bottom:8px}
.etsMockCard .mcTitle{font-size:18px;font-weight:700;margin-bottom:4px}
.etsMockCard .mcSub{font-size:13px;opacity:.7;margin-bottom:14px}
.etsMockCard .mcBtnRow{display:flex;gap:10px}
.etsMockCard .mcBtn{flex:1;border-radius:10px;padding:10px;font-size:14px;font-weight:600;text-align:center;border:none;cursor:pointer;transition:transform .12s}
.etsMockCard .mcBtn:active{transform:scale(.96)}
.etsMockCard .mcBtnPrimary{background:#fff;color:#1a1a2e}
.etsMockCard .mcBtnSecondary{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}
/* 专项突破卡片 */
.etsPartCard{background:var(--bg-card);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s;cursor:pointer}
.etsPartCard:active{transform:scale(.99);box-shadow:var(--shadow-hover)}
.etsPartCard .epcHead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.etsPartCard .epcIcon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;flex-shrink:0}
.etsPartCard .epcTitle{font-size:16px;font-weight:700}
.etsPartCard .epcSub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.etsPartCard .epcProgress{display:flex;align-items:center;gap:8px;margin-top:8px}
.etsPartCard .epcBar{flex:1;height:6px;border-radius:3px;background:var(--bg-secondary);overflow:hidden}
.etsPartCard .epcBarFill{height:100%;border-radius:3px;transition:width .5s}
.etsPartCard .epcBarText{font-size:12px;color:var(--text-secondary);font-weight:600;white-space:nowrap}
.etsPartCard .epcStars{display:flex;gap:2px;margin-top:6px}
.etsPartCard .epcStar{font-size:14px;color:#d1d5db}
.etsPartCard .epcStar.active{color:#fbbf24}
/* 年级/来源选择器 */
.etsYearBar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.etsYearBar::-webkit-scrollbar{display:none}
.etsYearChip{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);transition:all .15s;white-space:nowrap;cursor:pointer}
.etsYearChip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 同步训练列表 */
.etsUnitItem{background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:transform .12s;cursor:pointer}
.etsUnitItem:active{transform:scale(.99)}
.etsUnitItem .euiIcon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff;flex-shrink:0}
.etsUnitItem .euiBody{flex:1;min-width:0}
.etsUnitItem .euiTitle{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etsUnitItem .euiSub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.etsUnitItem .euiStars{display:flex;gap:2px}
.etsUnitItem .euiStar{font-size:13px;color:#d1d5db}
.etsUnitItem .euiStar.active{color:#fbbf24}
.etsUnitItem .euiArrow{color:var(--text-tertiary);font-size:18px}
/* 拓展页面 */
.etsExpandGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.etsExpandItem{background:var(--bg-card);border-radius:14px;padding:16px 12px;text-align:center;box-shadow:var(--shadow);transition:transform .12s,box-shadow .2s;cursor:pointer;position:relative;overflow:hidden}
.etsExpandItem:active{transform:scale(.97);box-shadow:var(--shadow-hover)}
.etsExpandItem .eeiIcon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;color:#fff;margin:0 auto 8px}
.etsExpandItem .eeiTitle{font-size:14px;font-weight:600}
.etsExpandItem .eeiSub{font-size:11px;color:var(--text-secondary);margin-top:2px}
.etsExpandItem .eeiBadge{position:absolute;top:8px;right:8px;background:#ef4444;color:#fff;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:700}
/* 学情分析 */
.etsAnalysisCard{background:var(--bg-card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.etsAnalysisCard h3{font-size:16px;font-weight:700;margin-bottom:12px}
.etsPredictScore{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.etsPredictScore .epsVal{font-size:42px;font-weight:800;color:var(--primary);letter-spacing:-.02em}
.etsPredictScore .epsMax{font-size:16px;color:var(--text-secondary);font-weight:600}
.etsPredictScore .epsTag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px}
/* 能力雷达图 */
.etsRadarChart{width:100%;max-width:280px;margin:0 auto;display:block}
.etsAbilityRow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.etsAbilityRow .earLabel{width:80px;font-size:13px;color:var(--text-secondary);text-align:right;flex-shrink:0}
.etsAbilityRow .earBar{flex:1;height:8px;border-radius:4px;background:var(--bg-secondary);overflow:hidden}
.etsAbilityRow .earBarFill{height:100%;border-radius:4px;transition:width .5s}
.etsAbilityRow .earVal{width:40px;font-size:13px;font-weight:700;flex-shrink:0}
/* 成长轨迹 */
.etsGrowthChart{display:flex;align-items:flex-end;gap:6px;height:100px;padding:10px 0;border-bottom:1px solid var(--border)}
.etsGrowthBar{flex:1;background:linear-gradient(180deg,var(--primary),var(--primary-dark));border-radius:4px 4px 0 0;min-height:4px;position:relative;transition:height .5s}
.etsGrowthBar .egbVal{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--text-secondary)}
.etsGrowthLabel{display:flex;gap:6px;margin-top:4px}
.etsGrowthLabel span{flex:1;text-align:center;font-size:10px;color:var(--text-tertiary)}
/* 音标学习 */
.etsPhoneticGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.etsPhoneticItem{background:var(--bg-card);border-radius:10px;padding:10px 6px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.etsPhoneticItem:active{transform:scale(.95)}
.etsPhoneticItem .epiSymbol{font-size:20px;font-weight:700;color:var(--primary)}
.etsPhoneticItem .epiExample{font-size:11px;color:var(--text-secondary);margin-top:2px}
/* 每日一句 */
.etsDailyCard{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);border-radius:16px;padding:20px;color:#fff;margin-bottom:14px;box-shadow:0 4px 20px rgba(245,87,108,.2)}
.etsDailyCard .edcLabel{font-size:12px;opacity:.8;margin-bottom:6px}
.etsDailyCard .edcEn{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:6px}
.etsDailyCard .edcCn{font-size:14px;opacity:.9}
.etsDailyCard .edcBtn{margin-top:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.etsDailyCard .edcBtn:active{transform:scale(.96)}
/* 学习计划 */
.etsPlanCard{background:var(--bg-card);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
.etsPlanCard .eplHead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.etsPlanCard .eplIcon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff;flex-shrink:0}
.etsPlanCard .eplTitle{font-size:15px;font-weight:600}
.etsPlanCard .eplProgress{font-size:12px;color:var(--text-secondary)}
/* AI推荐 */
.etsAIRecCard{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);border-radius:16px;padding:18px;color:#fff;margin-bottom:14px;box-shadow:0 4px 20px rgba(79,172,254,.2)}
.etsAIRecCard .earcTitle{font-size:16px;font-weight:700;margin-bottom:6px}
.etsAIRecCard .earcSub{font-size:13px;opacity:.85;margin-bottom:12px}
.etsAIRecCard .earcItem{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:transform .12s}
.etsAIRecCard .earcItem:active{transform:scale(.97)}
.etsAIRecCard .earcItem .eariText{font-size:13px;font-weight:500}
.etsAIRecCard .earcItem .eariArrow{font-size:16px}

/* ===== E听说风格：逐词颜色标注 ===== */
.etsWordEval{background:var(--bg-tertiary);border-radius:12px;padding:20px 16px;line-height:2.6;font-size:18px;letter-spacing:.02em;margin-top:12px}
.etsWordEval .weWord{display:inline;padding:2px 4px;border-radius:4px;margin:1px;transition:all .2s}
.etsWordEval .weWord.correct{color:#16a34a;background:rgba(22,163,74,.08)}
.etsWordEval .weWord.wrong{color:#dc2626;background:rgba(220,38,38,.1);text-decoration:underline wavy #dc2626}
.etsWordEval .weWord.partial{color:#d97706;background:rgba(217,119,6,.08)}
.etsWordEval .weWord.missed{color:#9ca3af;background:rgba(156,163,175,.06);text-decoration:line-through}
.etsWordEval .weWord.unsure{color:#6366f1;background:rgba(99,102,241,.08)}
.etsWordLegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.etsWordLegend .wlItem{display:flex;align-items:center;gap:4px}
.etsWordLegend .wlDot{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ===== E听说风格：评分对比卡 ===== */
.etsScoreCompare{display:flex;gap:8px;margin-top:12px}
.etsScoreCard{flex:1;background:var(--bg-card);border-radius:12px;padding:12px 8px;text-align:center;border:2px solid transparent;transition:all .2s}
.etsScoreCard.current{border-color:var(--primary);background:rgba(59,130,246,.05)}
.etsScoreCard .scLabel{font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.etsScoreCard .scVal{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.etsScoreCard .scMax{font-size:11px;color:var(--text-tertiary)}
.etsScoreCard .scTag{font-size:10px;font-weight:700;margin-top:2px}
.etsScoreCard .scTag.up{color:#16a34a}
.etsScoreCard .scTag.down{color:#dc2626}
.etsScoreCard .scTag.same{color:var(--text-secondary)}

/* ===== E听说风格：思维导图 ===== */
.etsMindMap{background:var(--bg-tertiary);border-radius:14px;padding:20px;margin-top:12px;position:relative;overflow:hidden}
.etsMindMap .mmCenter{display:flex;justify-content:center;margin-bottom:16px}
.etsMindMap .mmNode{background:var(--primary);color:#fff;border-radius:20px;padding:8px 18px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(59,130,246,.3);text-align:center;max-width:200px}
.etsMindMap .mmBranches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.etsMindMap .mmBranch{background:var(--bg-card);border-radius:10px;padding:10px 12px;border-left:3px solid var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.etsMindMap .mmBranch .mbKeyword{font-size:13px;font-weight:700;color:var(--primary)}
.etsMindMap .mmBranch .mbCn{font-size:11px;color:var(--text-secondary);margin-top:2px}
.etsMindMap .mmBranch .mbSub{font-size:12px;color:var(--text);margin-top:4px;padding-left:8px;border-left:2px solid var(--border)}

/* ===== E听说风格：录音界面 ===== */
.etsRecCard{border-radius:16px;padding:24px 20px;text-align:center;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:all .3s ease}
.etsRecCard:not(.recording){background:linear-gradient(135deg,#e3f2fd,#bbdefb);border:1px solid rgba(46,125,50,.2)}
.etsRecCard.recording{background:linear-gradient(135deg,#fce4ec,#ffcdd2);border:1px solid rgba(244,67,54,.25)}
.etsRecCard .rcIcon{width:64px;height:64px;border-radius:50%;background:rgba(46,125,50,.12);display:grid;place-items:center;margin:0 auto 12px;position:relative}
.etsRecCard .rcIcon::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(46,125,50,.2)}
.etsRecCard .rcIcon .rcMic{font-size:28px;color:#2e7d32}
.etsRecCard.recording .rcIcon{background:rgba(244,67,54,.2)}
.etsRecCard.recording .rcIcon::before{border-color:rgba(244,67,54,.4);animation:etsPulse 1.5s ease-out infinite}
.etsRecCard.recording .rcIcon .rcMic{color:#f44336}
.etsRecCard .rcStatus{color:#1a3c1e;font-size:15px;font-weight:600;margin-bottom:8px}
.etsRecCard .rcTimer{font-size:36px;font-weight:800;color:#2e7d32;font-variant-numeric:tabular-nums;letter-spacing:.05em}
.etsRecCard.recording .rcTimer{color:#f44336}
.etsRecCard .rcLabel{color:#4a7a4c;font-size:12px;margin-top:4px}
.etsRecCard .rcWave{display:flex;align-items:center;justify-content:center;gap:3px;height:30px;margin:12px 0}
.etsRecCard .rcWave .rwBar{width:3px;background:#f44336;border-radius:2px;animation:etsWave 1s ease-in-out infinite alternate}
@keyframes etsPulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}
@keyframes etsWave{0%{height:6px}100%{height:24px}}

/* ===== E听说风格：对话气泡 ===== */
.etsChatItem{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.etsChatItem.right{flex-direction:row-reverse}
.etsChatItem .ciAvatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex-shrink:0;color:#fff;font-weight:700}
.etsChatItem .ciAvatar.computer{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.etsChatItem .ciAvatar.you{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.etsChatItem .ciBubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.etsChatItem:not(.right) .ciBubble{background:var(--bg-tertiary);border-bottom-left-radius:4px}
.etsChatItem.right .ciBubble{background:rgba(139,92,246,.1);border-bottom-right-radius:4px}
.etsChatItem .ciBubble .ciEn{color:var(--text)}
.etsChatItem .ciBubble .ciCn{font-size:12px;color:var(--text-secondary);margin-top:4px}

/* ===== E听说风格：分句练习 ===== */
.etsSentenceList{margin-top:12px}
.etsSentenceItem{background:var(--bg-tertiary);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.etsSentenceItem:active{transform:scale(.98)}
.etsSentenceItem.played{border-left:3px solid var(--success)}
.etsSentenceItem .siNum{width:24px;height:24px;border-radius:50%;background:var(--bg-secondary);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.etsSentenceItem.played .siNum{background:var(--success);color:#fff}
.etsSentenceItem .siText{flex:1;font-size:14px;line-height:1.5}
.etsSentenceItem .siPlay{font-size:18px;flex-shrink:0}

/* ===== E听说风格：维度评分条 ===== */
.etsDimScore{background:var(--bg-tertiary);border-radius:12px;padding:14px;margin-top:10px}
.etsDimScore .dsRow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.etsDimScore .dsRow:last-child{margin-bottom:0}
.etsDimScore .dsLabel{width:70px;font-size:13px;font-weight:600;flex-shrink:0}
.etsDimScore .dsBar{flex:1;height:10px;border-radius:5px;background:var(--bg-secondary);overflow:hidden}
.etsDimScore .dsBarFill{height:100%;border-radius:5px;transition:width .6s ease}
.etsDimScore .dsVal{width:55px;font-size:14px;font-weight:700;text-align:right;flex-shrink:0}
/* ===== v10 四Tab新版UI（首页/练习/指南/我的） ===== */
:root{
  --brand:#0a6cff;--brand-deep:#0956d3;--brand-grad:linear-gradient(135deg,#1b7bff,#0a5cd6);
  --brand-bg:#eef5ff;--brand-border:#c9ddff;
}
.pageHero{background:var(--brand-grad);color:#fff;border-radius:0 0 0 0;padding:26px 20px 22px;margin:-14px -14px 16px;position:relative;overflow:hidden}
.pageHero.round{border-radius:0 0 26px 26px;margin-bottom:-6px;padding-bottom:34px}
.pageHero h1{font-size:24px;font-weight:800;letter-spacing:.01em}
.pageHero .phSub{font-size:13px;opacity:.88;margin-top:5px;font-weight:400}
.pageHero .phDeco{position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.pageHero .phDeco2{position:absolute;right:40px;bottom:-60px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.06)}
.statRow{background:#fff;border-radius:16px;padding:16px 8px;display:grid;grid-template-columns:1fr 1fr 1fr;box-shadow:var(--shadow);margin-bottom:16px}
.statCell{text-align:center;position:relative}
.statCell+.statCell::before{content:"";position:absolute;left:0;top:16%;height:68%;width:1px;background:var(--border-light)}
.statIcon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:19px}
.statIcon.fire{background:#fff3e8}
.statIcon.clock{background:var(--brand-bg)}
.statIcon.trophy{background:#ffeef0}
.statVal{font-size:20px;font-weight:800;color:var(--text);line-height:1.2}
.statVal small{font-size:11px;font-weight:400;color:var(--text-tertiary);margin-left:2px}
.statLbl{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.secTitle{font-size:17px;font-weight:800;margin:4px 0 12px;display:flex;align-items:center;justify-content:space-between}
.secTitle .more{font-size:12px;font-weight:500;color:var(--brand)}
.homeCards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.homeCard{background:#fff;border-radius:14px;padding:16px 6px;text-align:center;box-shadow:var(--shadow);border:1.5px solid transparent;transition:transform .12s}
.homeCard:active{transform:scale(.96)}
.homeCard.hl{background:var(--brand-bg);border-color:var(--brand-border)}
.homeCard .hcIcon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.homeCard .hcIcon svg{width:24px;height:24px}
.homeCard .hcTitle{font-size:14px;font-weight:700}
.homeCard .hcSub{font-size:11px;color:var(--text-tertiary);margin-top:3px}
.recentItem{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);margin-bottom:8px}
.recentItem .riIcon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.recentItem .riBody{flex:1;min-width:0}
.recentItem .riTitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recentItem .riSub{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.recentItem .riScore{font-size:15px;font-weight:800;flex-shrink:0}
.emptyTip{text-align:center;color:var(--text-tertiary);font-size:13px;padding:26px 10px;background:#fff;border-radius:14px;box-shadow:var(--shadow)}
.modeRow{background:#fff;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);margin-bottom:12px;transition:transform .12s}
.modeRow:active{transform:scale(.98)}
.modeRow .mrIcon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modeRow .mrIcon svg{width:26px;height:26px}
.modeRow .mrBody{flex:1;min-width:0}
.modeRow .mrTitle{font-size:16px;font-weight:700}
.modeRow .mrSub{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.6}
.modeRow .mrArrow{color:var(--text-tertiary);font-size:20px;flex-shrink:0}
.guideRow{background:#fff;border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);margin-bottom:12px;transition:transform .12s}
.guideRow:active{transform:scale(.98)}
.guideRow .grIcon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.guideRow .grIcon svg{width:22px;height:22px}
.guideRow .grBody{flex:1;min-width:0}
.guideRow .grTitle{font-size:15px;font-weight:700}
.guideRow .grSub{font-size:12px;color:var(--text-tertiary);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guideRow .grArrow{color:var(--text-tertiary);font-size:18px;flex-shrink:0}
.meCard{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.meMenuRow{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--border-light);transition:background .12s}
.meMenuRow:active{background:var(--bg-tertiary)}
.meMenuRow:last-child{border-bottom:none}
.meMenuRow .mmIcon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
.meMenuRow .mmBody{flex:1;min-width:0}
.meMenuRow .mmTitle{font-size:15px;font-weight:600}
.meMenuRow .mmSub{font-size:11px;color:var(--text-tertiary);margin-top:1px}
.meMenuRow .mmArrow{color:var(--text-tertiary);flex-shrink:0;font-size:16px}
.meInfoBar{background:#fff;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);margin-bottom:14px}
.meAvatarV2{width:56px;height:56px;border-radius:50%;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 4px 14px rgba(10,108,255,.3)}
.tabbarV2{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 calc(6px + var(--safe-bottom));z-index:50}
.tabbarV2 button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-tertiary);font-size:10.5px;padding:3px 0}
.tabbarV2 button svg{width:23px;height:23px}
.tabbarV2 button.active{color:var(--brand);font-weight:700}
.tabbarV2 button.active svg{filter:none}
.app{padding-bottom:calc(74px + var(--safe-bottom))}
.backNav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.backNav .bnBtn{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-secondary)}
.backNav .bnTitle{font-size:17px;font-weight:700}
/* 考场播报条 */
.announceBar{background:#0f1525;color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px;box-shadow:0 2px 12px rgba(15,21,37,.18)}
.announceBar .abIcon{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.announceBar .abText{font-size:13.5px;font-weight:600;flex:1;line-height:1.5}
.announceBar .abEn{display:block;font-size:11px;font-weight:400;opacity:.72;margin-top:2px}
/* 录音波纹 */
.recWaveRow{display:flex;align-items:center;justify-content:center;gap:3px;height:26px;margin:8px 0}
.recWaveRow i{width:3px;border-radius:2px;background:#ef4444;animation:wv 1s infinite ease-in-out}
@keyframes wv{0%,100%{height:6px}50%{height:22px}}
.recWaveRow i:nth-child(2){animation-delay:.12s}.recWaveRow i:nth-child(3){animation-delay:.24s}
.recWaveRow i:nth-child(4){animation-delay:.36s}.recWaveRow i:nth-child(5){animation-delay:.48s}
.recWaveRow.paused i{animation-play-state:paused;background:#94a3b8}
/* 提问倒计时大数字 */
.qCountNum{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.qCountLabel{text-align:center;font-size:12px;color:var(--text-tertiary);margin-top:2px}
.qPromptCn{background:#fffbeb;border-left:3px solid #f59e0b;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;margin:10px 0}
.setPickRow{background:#fff;border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);margin-bottom:8px}
.setPickRow:active{transform:scale(.98)}
.setPickRow .spYear{font-size:13px;font-weight:800;color:#fff;border-radius:8px;padding:4px 10px;flex-shrink:0}
.setPickRow .spBody{flex:1;min-width:0}
.setPickRow .spTitle{font-size:14px;font-weight:600}
.setPickRow .spSub{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.pillRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--border);color:var(--text-secondary)}
.pill.active{background:var(--brand);border-color:var(--brand);color:#fff}
/* ===== 高考指令播报页 ===== */
.instrStage{background:#fff;border-radius:18px;padding:28px 22px 22px;text-align:center;box-shadow:var(--shadow)}
.insPartTag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand);background:var(--brand-bg);border-radius:999px;padding:5px 14px;margin-bottom:12px}
.insTitle{font-size:26px;font-weight:800;margin:2px 0 6px}
.insScoreTag{display:inline-block;font-size:12px;font-weight:700;color:#f59e0b;background:#fffbeb;border-radius:8px;padding:4px 12px;margin-bottom:14px}
.insBody{text-align:left;background:var(--bg-tertiary,#f6f8fc);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.insCn{font-size:14px;line-height:1.9;color:var(--text);margin:0 0 6px}
.insEn{font-size:13px;line-height:1.8;color:var(--text-secondary,#5a6786);font-style:italic;margin:4px 0 0}
.insStatus{font-size:13px;color:var(--text-tertiary);margin-top:8px;font-weight:600}
.announceBar .abCn{font-size:13.5px;font-weight:600;line-height:1.5}
.announceBar .abEn{display:block;font-size:11px;font-weight:400;opacity:.72;margin-top:2px}

</style>

/* 语音引擎（三重回退：原生TTS → Web Speech API → 计时模式） */
var Speech={};
Speech._nativeBridge=(typeof window.NativeTTS!=="undefined");
Speech._nativeReady=false;
Speech._nativeResolve=null;
Speech._nativeTimer=null;
Speech._voices=[];
Speech._enVoice=null;
Speech._initDone=false;
Speech._webSupported=("speechSynthesis" in window);
Speech._webActuallyWorks=null; /* null=未测试, true=可用, false=不可用 */
Speech.supported=function(){
  if(Speech._nativeBridge&&Speech._nativeReady)return true;
  if(Speech._webSupported&&Speech._webActuallyWorks!==false)return true;
  return false;
};
Speech.init=function(){
  if(Speech._initDone)return;
  Speech._initDone=true;
  /* 原生TTS桥接初始化 */
  if(Speech._nativeBridge){
    window.NativeTTS._onDone=function(){
      if(Speech._nativeTimer){clearTimeout(Speech._nativeTimer);Speech._nativeTimer=null;}
      if(Speech._nativeResolve){var r=Speech._nativeResolve;Speech._nativeResolve=null;r();}
    };
    window.NativeTTS._onError=function(){
      if(Speech._nativeTimer){clearTimeout(Speech._nativeTimer);Speech._nativeTimer=null;}
      if(Speech._nativeResolve){var r=Speech._nativeResolve;Speech._nativeResolve=null;r();}
    };
    window.NativeTTS._onStart=function(){};
    /* 轮询检查原生TTS是否就绪 */
    var nativeChecks=0;
    function checkNative(){
      nativeChecks++;
      try{
        if(window.NativeTTS.isReady()){
          Speech._nativeReady=true;
          console.log("[Speech] Native TTS bridge ready");
          return;
        }
      }catch(e){}
      if(nativeChecks<30){setTimeout(checkNative,200);}
      else{console.log("[Speech] Native TTS not ready after 6s, will use fallback");}
    }
    checkNative();
    /* 不return，继续初始化Web Speech API作为回退 */
  }

      Speech._enVoice=Speech._voices.filter(function(v){return /en[-_]US/i.test(v.lang);})[0]||Speech._voices.filter(function(v){return /^en/i.test(v.lang);})[0]||null;
    }
  }
  loadVoices();
  if(window.speechSynthesis.onvoiceschanged===null){
    window.speechSynthesis.onvoiceschanged=loadVoices;
  }
};
/* 中文语音播报（考场剩余时间提示等） */
Speech.speakZh=function(text,opts){
  opts=opts||{};
  Speech.init();
  var rate=opts.rate||1.0;
  if(Speech._webSupported){
    return new Promise(function(resolve){
      try{
        window.speechSynthesis.cancel();
        var voices=window.speechSynthesis.getVoices()||[];
        var zhVoice=voices.filter(function(v){return /zh[-_]CN/i.test(v.lang);})[0]||voices.filter(function(v){return /^zh/i.test(v.lang);})[0]||null;
        var u=new SpeechSynthesisUtterance(text);
        u.lang="zh-CN";
        u.rate=rate;
        u.pitch=1;
        u.volume=1;
        if(zhVoice)u.voice=zhVoice;
        var resolved=false;
        u.onend=function(){if(!resolved){resolved=true;resolve();}};
        u.onerror=function(){if(!resolved){resolved=true;resolve();}};
        setTimeout(function(){try{window.speechSynthesis.speak(u);}catch(e){if(!resolved){resolved=true;resolve();}}},50);
        /* 超时保护：按字数估算 */
        setTimeout(function(){if(!resolved){resolved=true;try{window.speechSynthesis.cancel();}catch(e2){}resolve();}},(text.length*260)+4000);
      }catch(e){resolve();}
    });
  }
  /* 无中文TTS：按字数估算等待，保持流程节奏 */
  return new Promise(function(resolve){setTimeout(resolve,Math.max(1200,text.length*240));});
};

Speech.speak=function(text,opts){
  opts=opts||{};
  Speech.init();
  var rate=opts.rate||0.95;
  /* 中文内容走中文通道 */
  if(opts.lang==="zh"||/^[\u4e00-\u9fa5\u3001\u3002\uff0c\uff1f\uff01]/.test((text||"").trim())){
    return Speech.speakZh(text,opts);
  }
  /* 优先：原生TTS桥接 */
  if(Speech._nativeBridge&&Speech._nativeReady){
    return new Promise(function(resolve){
      Speech.stop();
      Speech._nativeResolve=resolve;
      try{window.NativeTTS.speak(text,rate);}catch(e){resolve();return;}
      /* 超时保护：按字数估算时长 */
      var estMs=Math.max(2000,text.length*120)+3000;
      Speech._nativeTimer=setTimeout(function(){
        if(Speech._nativeResolve){Speech._nativeResolve=null;resolve();}
      },estMs);
    });
  }
  /* 其次：Web Speech API（带快速检测，WebView中可能静默失败） */
  if(Speech._webSupported&&Speech._webActuallyWorks!==false){
    return new Promise(function(resolve){
      try{
        window.speechSynthesis.cancel();
        if(!Speech._voices.length){Speech._voices=window.speechSynthesis.getVoices()||[];}
        if(!Speech._enVoice&&Speech._voices.length){
          Speech._enVoice=Speech._voices.filter(function(v){return /en[-_]US/i.test(v.lang);})[0]||Speech._voices.filter(function(v){return /^en/i.test(v.lang);})[0]||null;
        }
        var u=new SpeechSynthesisUtterance(text);
        u.lang="en-US";
        u.rate=rate;
        u.pitch=opts.pitch||1;
        u.volume=1;
        if(Speech._enVoice)u.voice=Speech._enVoice;
        var resolved=false;
        var webStarted=false;
        u.onstart=function(){webStarted=true;Speech._webActuallyWorks=true;};
        u.onend=function(){if(!resolved){resolved=true;resolve();}};
        u.onerror=function(){if(!resolved){resolved=true;resolve();}};
        setTimeout(function(){
          try{window.speechSynthesis.speak(u);}catch(e){if(!resolved){resolved=true;resolve();}}
        },50);
        /* 快速检测：1.5秒内Web Speech未开始则判定不可用，回退到计时模式 */
        setTimeout(function(){
          if(!webStarted&&!resolved){
            Speech._webActuallyWorks=false;
            resolved=true;
            try{window.speechSynthesis.cancel();}catch(e){}
            resolve();
          }
        },1500);
        /* 超时保护 */
        setTimeout(function(){if(!resolved){resolved=true;window.speechSynthesis.cancel();resolve();}},(text.length*100)+5000);
      }catch(e){resolve();}
    });
  }
  /* 最后：计时回退模式（无TTS时按字数估算时长继续流程） */
  return new Promise(function(resolve){
    var estMs=Math.max(1500,text.length*80);
    setTimeout(resolve,estMs);
  });
};
Speech.stop=function(){
  if(Speech._nativeBridge&&Speech._nativeReady){
    try{window.NativeTTS.stop();}catch(e){}
    if(Speech._nativeTimer){clearTimeout(Speech._nativeTimer);Speech._nativeTimer=null;}
    if(Speech._nativeResolve){Speech._nativeResolve=null;}
    return;
  }
  if(Speech._webSupported)try{window.speechSynthesis.cancel();}catch(e){}
};

/* 评分（严格按高考标准） */
function scoreGrade(pct){if(pct>=80)return {level:"high",label:"优秀",color:"#3b82f6"};if(pct>=65)return {level:"mid",label:"良好",color:"#f59e0b"};return {level:"low",label:"待提高",color:"#ef4444"};}
/* Part A 模仿朗读（20分）：语音语调8分 + 语速与节奏6分 + 完整性6分 */
function scoreReading(spokenText,referenceText){
  if(!spokenText||!spokenText.trim())return {score:0,pronunciation:0,rhythm:0,completeness:0,transcript:"",missing:[],grade:scoreGrade(0),dims:[["语音语调",0,8],["语速节奏",0,6],["完整性",0,6]]};
  var spoken=spokenText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var ref=referenceText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var spokenSet={};spoken.forEach(function(w){spokenSet[w]=1;});
  var hit=0;ref.forEach(function(w){if(spokenSet[w])hit++;});
  var coverage=ref.length?Math.round(hit/ref.length*100):0; /* 完整性 */
  var fluency=Math.min(100,Math.round(spoken.length/Math.max(8,ref.length*0.7)*100)); /* 语速 */
  var accuracy=Math.min(100,coverage+10); /* 语音准确度 */
  /* 语音语调 8分：基于发音准确度 */
  var pronunciation=Math.round(accuracy/100*8);
  /* 语速与节奏 6分：基于流畅度 */
  var rhythm=Math.round(fluency/100*6);
  /* 完整性 6分：基于覆盖度 */
  var completeness=Math.round(coverage/100*6);
  var score=pronunciation+rhythm+completeness;
  score=Math.max(0,Math.min(20,score));
  var missing=ref.filter(function(w,i,arr){return !spokenSet[w]&&arr.indexOf(w)===i;}).slice(0,8);
  var pct=Math.round(score/20*100);
  return {score:score,pronunciation:pronunciation,rhythm:rhythm,completeness:completeness,coverage:coverage,fluency:Math.min(100,fluency),accuracy:Math.min(100,accuracy),transcript:spokenText,missing:missing,grade:scoreGrade(pct),dims:[["语音语调",pronunciation,8],["语速节奏",rhythm,6],["完整性",completeness,6]]};
}
/* Part B 角色扮演（16分）：三问6分（每问2分）+ 五答10分（每答2分） */
function scoreAnswer(spokenText,referenceAnswer){
  if(!spokenText||!spokenText.trim())return {score:0,ok:false,transcript:"",matchRatio:0,grade:scoreGrade(0)};
  var spoken=spokenText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var ref=(referenceAnswer||"").toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  if(!ref.length)return {score:2,ok:true,transcript:spokenText,matchRatio:100,grade:scoreGrade(100)};
  var refSet={};ref.forEach(function(w){if(w.length>2)refSet[w]=1;});
  var hit=0;Object.keys(refSet).forEach(function(w){if(spoken.indexOf(w)>=0)hit++;});
  var ratio=Object.keys(refSet).length?hit/Object.keys(refSet).length:1;
  /* 严格评分：0-2分，关键词匹配率决定 */
  var sc=ratio>=0.6?2:(ratio>=0.3?1:0);
  return {score:sc,ok:ratio>=0.4,transcript:spokenText,matchRatio:Math.round(ratio*100),grade:scoreGrade(ratio*100)};
}
/* Part C 故事复述（24分）：内容12分 + 语言8分 + 流利度4分 */
function scoreRetell(spokenText,keywords,storyText){
  if(!spokenText||!spokenText.trim())return {score:0,content:0,language:0,fluency:0,coverage:0,kwHit:0,transcript:"",grade:scoreGrade(0),dims:[["内容",0,12],["语言",0,8],["流利度",0,4]]};
  var spoken=spokenText.toLowerCase();
  var spokenWords=spoken.replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var storyWords=storyText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var storySet={};storyWords.forEach(function(w){if(w.length>3)storySet[w]=1;});
  var kwHit=0;keywords.forEach(function(k){if(spoken.indexOf(k.en.toLowerCase())>=0)kwHit++;});
  var spokenHit=0;Object.keys(storySet).forEach(function(w){if(spokenWords.indexOf(w)>=0)spokenHit++;});
  var coverage=storySet.length?Math.round(spokenHit/Object.keys(storySet).length*100):0;
  var kwPct=keywords.length?Math.round(kwHit/keywords.length*100):0;
  /* 内容 12分：覆盖度40% + 关键词60% */
  var content=Math.round((coverage*0.4+kwPct*0.6)/100*12);
  /* 语言 8分：基于词汇丰富度和句长 */
  var uniqueWords={};spokenWords.forEach(function(w){if(w.length>2)uniqueWords[w]=1;});
  var langScore=Math.min(100,Math.round(Object.keys(uniqueWords).length*4+spokenWords.length*0.5));
  var language=Math.round(langScore/100*8);
  /* 流利度 4分：基于语速和长度 */
  var fluencyScore=Math.min(100,Math.round(spokenWords.length*3));
  var fluency=Math.round(fluencyScore/100*4);
  var score=content+language+fluency;
  score=Math.max(0,Math.min(24,score));
  return {score:score,content:content,language:language,fluency:fluency,coverage:coverage,kwHit:kwHit,kwTotal:keywords.length,transcript:spokenText,grade:scoreGrade(score/24*100),dims:[["内容",content,12],["语言",language,8],["流利度",fluency,4]]};
}

/* E听说风格：逐词颜色评估 */
function evalWords(spokenText,referenceText){
  if(!spokenText||!spokenText.trim()){
    var refWords=referenceText.split(/\s+/).filter(Boolean);
    return refWords.map(function(w){return {word:w,status:"missed"};});
  }
  var spoken=spokenText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var ref=referenceText.split(/\s+/).filter(Boolean);
  var spokenSet={};spoken.forEach(function(w){spokenSet[w]=1;});
  var spokenFreq={};spoken.forEach(function(w){spokenFreq[w]=(spokenFreq[w]||0)+1;});
  return ref.map(function(w){
    var clean=w.toLowerCase().replace(/[^a-z0-9']/g,"");
    if(!clean)return {word:w,status:"correct"};
    if(spokenSet[clean]){
      spokenFreq[clean]--;
      if(spokenFreq[clean]<0)return {word:w,status:"partial"};
      return {word:w,status:"correct"};
    }
    /* 模糊匹配：检查是否有相似的词 */
    var similar=false;
    for(var i=0;i<spoken.length;i++){
      if(levenshtein(clean,spoken[i])<=1&&clean.length>3){similar=true;break;}
    }
    return {word:w,status:similar?"partial":"missed"};
  });
}
function levenshtein(a,b){
  if(a.length===0)return b.length;if(b.length===0)return a.length;
  var m=[];for(var i=0;i<=b.length;i++)m[i]=[i];for(var j=0;j<=a.length;j++)m[0][j]=j;
  for(var i=1;i<=b.length;i++){for(var j=1;j<=a.length;j++){if(b.charAt(i-1)===a.charAt(j-1))m[i][j]=m[i-1][j-1];else m[i][j]=Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);}}
  return m[b.length][a.length];
}
function renderWordEval(spokenText,referenceText){
  var words=evalWords(spokenText,referenceText);
  var box=el("div",{className:"etsWordEval"});
  words.forEach(function(w){
    var span=el("span",{className:"weWord "+w.status,text:w.word});
    box.appendChild(span);

  /* 图例 */

  legend.appendChild(el("div",{className:"wlItem"},[el("span",{className:"wlDot",style:{background:"#16a34a"}}),el("span",{text:"正确"})]));
  legend.appendChild(el("div",{className:"wlItem"},[el("span",{className:"wlDot",style:{background:"#d97706"}}),el("span",{text:"部分正确"})]));
  legend.appendChild(el("div",{className:"wlItem"},[el("span",{className:"wlDot",style:{background:"#9ca3af"}}),el("span",{text:"未识别"})]));
  box.appendChild(legend);
  return box;
}

/* E听说风格：评分对比（本次/上次/最高） */
function scoreHistory(part,id){
  var records=State.scores.filter(function(s){return s.part===part&&s.id===id;});
  if(!records.length)return {current:null,prev:null,best:null};
  var sorted=records.slice().sort(function(a,b){return a.date-b.date;});
  var current=sorted[sorted.length-1];
  var prev=sorted.length>1?sorted[sorted.length-2]:null;
  var best=records.slice().sort(function(a,b){return b.score-a.score;})[0];
  return {current:current,prev:prev,best:best};
}

/* 进度 */
function recordScore(part,id,score,max){State.scores.push({part:part,id:id,score:score,max:max,date:Date.now()});if(State.scores.length>500)State.scores=State.scores.slice(-500);save(LSC.scores,State.scores);if(score/max<0.6){var item=DATA["part"+part].filter(function(d){return d.id===id;})[0];if(item)addError(part,item,score,max);}State.progress.done[id]={score:score,max:max,date:Date.now()};save(LSC.progress,State.progress);}
function avgScore(part){var s=State.scores.filter(function(x){return x.part===part;});if(!s.length)return null;return Math.round(s.reduce(function(a,b){return a+b.score;},0)/s.length*10)/10;}
function totalDone(){return Object.keys(State.progress.done).length;}
function partDone(part){return DATA["part"+part].filter(function(d){return State.progress.done[d.id];}).length;}
function isRealExam(item){return item.source&&item.source.indexOf("高考真题")>=0;}
function diffLabel(d){return d==="easy"?"基础":d==="medium"?"进阶":d==="hard"?"挑战":d;}
/* 预测分：基于历史成绩推算高考听说预测分 */
function predictScore(){
  var a=avgScore("A"),b=avgScore("B"),c=avgScore("C");
  if(a==null||b==null||c==null){
    /* 部分有成绩时，用已有成绩推算 */
    var parts=[{v:a,m:20},{v:b,m:16},{v:c,m:24}];
    var known=parts.filter(function(p){return p.v!=null;});
    if(!known.length)return null;
    var knownScore=known.reduce(function(s,p){return s+p.v;},0);
    var knownMax=known.reduce(function(s,p){return s+p.m;},0);
    return Math.round(knownScore/knownMax*60);
  }
  return Math.round(a+b+c);
}

/* 星级评定（E听说风格） */
function starRating(score,max){
  var pct=score/max;
  if(pct>=0.85)return 3;
  if(pct>=0.65)return 2;
  if(pct>=0.4)return 1;
  return 0;
}
/* 能力维度分析 */
function abilityAnalysis(){
  var dims={
    pronunciation:{label:"语音语调",score:0,max:0},
    fluency:{label:"流利度",score:0,max:0},
    content:{label:"内容完整",score:0,max:0},
    grammar:{label:"语法表达",score:0,max:0},
    interaction:{label:"信息传递",score:0,max:0}
  };
  State.scores.forEach(function(s){
    if(s.part==="A"){
      dims.pronunciation.score+=Math.round(s.score*0.4);dims.pronunciation.max+=Math.round(s.max*0.4);
      dims.fluency.score+=Math.round(s.score*0.3);dims.fluency.max+=Math.round(s.max*0.3);
      dims.content.score+=Math.round(s.score*0.3);dims.content.max+=Math.round(s.max*0.3);
    }else if(s.part==="B"){
      dims.grammar.score+=Math.round(s.score*0.5);dims.grammar.max+=Math.round(s.max*0.5);
      dims.interaction.score+=Math.round(s.score*0.5);dims.interaction.max+=Math.round(s.max*0.5);
    }else if(s.part==="C"){
      dims.content.score+=Math.round(s.score*0.5);dims.content.max+=Math.round(s.max*0.5);
      dims.fluency.score+=Math.round(s.score*0.2);dims.fluency.max+=Math.round(s.max*0.2);
      dims.grammar.score+=Math.round(s.score*0.3);dims.grammar.max+=Math.round(s.max*0.3);
    }
  });
  Object.keys(dims).forEach(function(k){
    var d=dims[k];
    d.pct=d.max>0?Math.round(d.score/d.max*100):0;
  });
  return dims;
}

var SoundFX={
  ctx:null,
  _ac:function(){
    if(SoundFX.ctx)return SoundFX.ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC)SoundFX.ctx=new AC();
    }catch(e){}
    return SoundFX.ctx;
  },
  unlock:function(){
    var c=SoundFX._ac();
    if(c&&c.state==="suspended"){try{c.resume();}catch(e){}}
  },
  /* 基础单音：freq频率 dur时长(秒) vol音量 when相对延迟(秒) */
  tone:function(freq,dur,vol,when,type){
    var c=SoundFX._ac();if(!c)return;
    SoundFX.unlock();
    try{
      var t=c.currentTime+(when||0);
      var osc=c.createOscillator();
      var gain=c.createGain();
      osc.type=type||"sine";
      osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.exponentialRampToValueAtTime(vol||0.3,t+0.015);
      gain.gain.setValueAtTime(vol||0.3,t+(dur||0.3)*0.75);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.3));
      osc.connect(gain);gain.connect(c.destination);
      osc.start(t);osc.stop(t+(dur||0.3)+0.06);
    }catch(e){}
  },

  beepWarn:function(){SoundFX.tone(880,0.2,0.36);SoundFX.tone(880,0.2,0.36,0.32);},

        xhr.onerror=function(){rej(new Error("asset加载失败"));};
        xhr.send();

    });
  },
  /* 把资源包试题注入题库（全链路生效：选题/随机/同步训练） */
  applyToData:function(){
    var added=0;
    Object.keys(PackMgr.packs).forEach(function(pid){
      var rec=PackMgr.packs[pid],mf=rec.manifest;
      if(mf&&mf.sets){
        mf.sets.forEach(function(s){

            var aid="pk-"+pid+"-"+s.id+"-A";
            if(!_pkFind(DATA.partA,aid)){

                words:s.partA.text.split(/\s+/).filter(Boolean).length,text:s.partA.text,difficulty:s.partA.difficulty||"medium",
                _packVideo:s.partA.video?{pack:pid,path:s.partA.video,sec:s.partA.videoSec||0}:null});
              added++;
            }
          }
          if(s.partB&&s.partB.dialogue){
            var bid="pk-"+pid+"-"+s.id+"-B";
            if(!_pkFind(DATA.partB,bid)){
              DATA.partB.push({id:bid,title:s.partB.title||"真题角色扮演",topic:s.partB.topic||"真题",source:s.source||rec.name,
                scenario:s.partB.scenario||"",scenarioEn:s.partB.scenarioEn||"",dialogue:s.partB.dialogue,questions:s.partB.questions,
                fiveAnswers:s.partB.fiveAnswers,difficulty:s.partB.difficulty||"medium"});
              added++;
            }
          }
          if(s.partC&&s.partC.story){
            var cid="pk-"+pid+"-"+s.id+"-C";
            if(!_pkFind(DATA.partC,cid)){
              DATA.partC.push({id:cid,title:s.partC.title||"真题故事复述",topic:s.partC.topic||"真题",source:s.source||rec.name,
                summary:s.partC.summary||"",keywords:s.partC.keywords||[],story:s.partC.story,difficulty:s.partC.difficulty||"medium"});
              added++;
            }
          }
        });
      }else{
        added+=PackMgr._applyAuto(rec);
      }
    });
    return added;
  },
  /* 自动识别模式：外部下载的zip（如21世纪教育网/夸克网盘真题包） */
  _applyAuto:function(rec){
    var z=null;try{z=PackMgr.zipParse(rec.zip);}catch(e){return 0;}
    var vids=(rec.videos||[]),added=0;
    var docs=[];
    rec.entries.forEach(function(e){var ext=(e.name.split(".").pop()||"").toLowerCase();if(ext==="docx"||ext==="txt")docs.push(e);});
    var docTexts=[];
    docs.forEach(function(d){try{var t=ext2(d.name)==="docx"?PackMgr.extractDocx(z,d):PackMgr.textOf(z,d);if(t)docTexts.push(t);}catch(e2){}});
    function ext2(n){return (n.split(".").pop()||"").toLowerCase();}
    vids.forEach(function(vpath,vi){
      var base=vpath.split("/").pop().replace(/\.[^.]+$/,"");
      var ym=base.match(/(20\d{2})/),lm=base.match(/test\s*([A-Ea-e])/i);
      var target=null;
      if(ym){
        var year=ym[1],letter=lm?lm[1].toUpperCase():"";
        for(var i=0;i<DATA.partA.length;i++){
          var s=DATA.partA[i].source||"";
          if(s.indexOf(year)>=0&&(!letter||s.toUpperCase().indexOf("TEST "+letter)>=0)){target=DATA.partA[i];break;}
        }
      }
      if(target&&!target._packVideo){target._packVideo={pack:rec.id,path:vpath,sec:0};return;}
      if(target)return;
      var txt=null;
      docTexts.forEach(function(t){
        if(txt)return;
        var paras=t.split("\n").filter(function(p){var w=p.split(/\s+/).filter(Boolean);return w.length>=60&&/[a-zA-Z]/.test(p);});
        if(paras.length)txt=paras.sort(function(a,b){return b.length-a.length;})[0];
      });
      if(txt){
        var nid="pk-"+rec.id+"-"+vi;
        if(!_pkFind(DATA.partA,nid)){
          DATA.partA.push({id:nid,title:base.slice(0,30)||"导入真题视频",topic:"导入资源",source:(ym?("约"+ym[1]+"年真题导入"):"导入真题资源"),
            words:txt.split(/\s+/).filter(Boolean).length,text:txt,difficulty:"medium",_packVideo:{pack:rec.id,path:vpath,sec:0}});
          added++;
        }
      }
    });
    return added;
  },
  /* ---- 下载（多源+进度） ---- */
  download:function(def,onProg){
    var idx=0;
    function tryNext(){
      if(idx>=def.urls.length)return Promise.reject(new Error("所有下载源均不可用"));
      var url=def.urls[idx++]+"?_t="+Date.now();
      return fetch(url,{cache:"no-store"}).then(function(r){
        if(!r.ok)throw new Error("HTTP "+r.status);
        var total=+(r.headers.get("Content-Length")||0);
        if(!r.body||typeof r.body.getReader!=="function"){
          return r.arrayBuffer().then(function(ab){onProg&&onProg(1,ab.byteLength);return ab;});
        }
        var reader=r.body.getReader(),chunks=[],got=0;
        function pump(){return reader.read().then(function(res){
          if(res.done){
            onProg&&onProg(1,got);
            var ab=new ArrayBuffer(got),u8=new Uint8Array(ab),o2=0;
            chunks.forEach(function(c){u8.set(c,o2);o2+=c.length;});
            return ab;
          }
          chunks.push(res.value);got+=res.value.length;
          onProg&&onProg(total?got/total:0.5,got);
          return pump();
        });}
        return pump();
      }).catch(function(){return tryNext();});
    }
    return tryNext().then(function(ab){return PackMgr.install(def.id,def.name,def.desc,ab);});
  },
  /* ---- 导入本地zip ---- */
  importFile:function(file){
    var abP=(file.arrayBuffer&&typeof file.arrayBuffer==="function")?file.arrayBuffer():new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){res(null);};fr.readAsArrayBuffer(file);});
    return abP.then(function(ab){
      if(!ab)throw new Error("文件读取失败");
      var z=PackMgr.zipParse(ab);
      var entries=z.entries.filter(function(e){return !e.dir;});
      var hasMf=false;
      entries.forEach(function(e){if(e.name==="manifest.json"||/\/manifest\.json$/.test(e.name))hasMf=true;});
      var id="user-"+Date.now().toString(36);
      var name=file.name.replace(/\.zip$/i,"");
      if(hasMf){
        return PackMgr.install(id,name,"导入资源包",ab).then(function(rec){
          var n=(rec.manifest&&rec.manifest.sets)?rec.manifest.sets.length:0;
          return {id:id,name:name,summary:"标准资源包，已加入"+n+"套完整试题"};
        });
      }
      /* 自动识别外部真题包 */
      var vids=[],vidExt=["mp4","webm","mov","m4v","mkv","avi"];
      entries.forEach(function(e){var ext=(e.name.split(".").pop()||"").toLowerCase();if(vidExt.indexOf(ext)>=0)vids.push(e.name);});
      if(!vids.length)throw new Error("压缩包内未找到视频文件(mp4等)");
      var rec={id:id,name:name,desc:"导入资源包（自动识别）",manifest:null,entries:entries,videos:vids,zip:ab,at:Date.now()};
      return PackMgr.dbPut(rec).then(function(){
        PackMgr.packs[id]=rec;
        var added=PackMgr._applyAuto(rec);
        var linked=0;
        DATA.partA.forEach(function(d){if(d._packVideo&&d._packVideo.pack===id)linked++;});
        return {id:id,name:name,summary:"识别视频"+vids.length+"个：关联题库"+(linked-added)+"个，新建朗读试题"+added+"个"};
      });
    });
  },
  /* ---- 点开试题时自动解压指定媒体 ---- */
  getMedia:function(packId,path){
    var key=packId+"|"+path;
    if(PackMgr.cache[key])return Promise.resolve(PackMgr.cache[key]);
    var rec=PackMgr.packs[packId];
    if(!rec)return Promise.reject(new Error("资源包未就绪"));
    return new Promise(function(res,rej){
      try{
        var entry=null;
        for(var i=0;i<rec.entries.length;i++){if(rec.entries[i].name===path){entry=rec.entries[i];break;}}
        if(!entry||entry.dir)throw new Error("包内未找到 "+path);
        var out=PackMgr.zipInflate({buf:rec.zip,dv:new DataView(rec.zip)},entry);
        var ext=(path.split(".").pop()||"").toLowerCase();
        var mime=ext==="mp4"?"video/mp4":ext==="webm"?"video/webm":ext==="mp3"?"audio/mpeg":ext==="m4a"?"audio/mp4":ext==="wav"?"audio/wav":"application/octet-stream";
        var blob=new Blob([out],{type:mime});
        PackMgr.cache[key]=blob;
        res(blob);
      }catch(e){rej(e);}
    });
  }
};

function randomPractice(part){
  var data=DATA["part"+part];
  var undone=data.filter(function(d){return !State.progress.done[d.id];});
  var pool=undone.length>0?undone:data;
  var item=pool[Math.floor(Math.random()*pool.length)];
  toast("随机选题："+item.title+"（完整A→B→C练习）");
  showSoundCheck(function(){startChainPractice(part,item,false);});
}

function showSoundCheck(callback){
  var root=$("#root .app");root.innerHTML="";
  /* 返回按钮 */

  var backBtn=el("button",{className:"smallBtn",text:"← 返回"});
