  topBar.appendChild(el("span",{className:"versionPill",text:"试音"}));
  root.appendChild(topBar);
  var screen=el("div",{className:"soundCheckScreen"});
  screen.appendChild(el("div",{className:"scIcon",text:"🔊"}));
  screen.appendChild(el("div",{className:"scTitle",text:"试音阶段"}));
  screen.appendChild(el("div",{className:"scSub",text:"请确认耳机/扬声器声音正常，麦克风可正常录音"}));
  var txtBox=el("div",{className:"soundCheckText"});
  txtBox.appendChild(el("div",{text:"Life is like an ocean. Only the strong-willed can reach the other shore."}));
  txtBox.appendChild(el("div",{className:"cn",text:"生活就像海洋，只有意志坚强的人才能到达彼岸。"}));
  screen.appendChild(txtBox);
  var testRow=el("div",{className:"scTestRow"});
  /* 播放试音 */
  var audioBtn=el("button",{className:"scTestBtn"});
  audioBtn.appendChild(el("span",{text:"▶ 播放试音"}));
  audioBtn.addEventListener("click",function(){
    audioBtn.disabled=true;
    audioBtn.innerHTML="";
    audioBtn.appendChild(el("span",{text:"播放中..."}));
    Speech.speak("Life is like an ocean. Only the strong-willed can reach the other shore.",{rate:0.9}).then(function(){
      audioBtn.innerHTML="";
      audioBtn.appendChild(el("span",{text:"✓ 试音正常"}));
      audioBtn.classList.add("ready");
      audioBtn.disabled=false;
      checkReady();
    });
  });
  testRow.appendChild(audioBtn);
  /* 麦克风测试 */
  var micBtn=el("button",{className:"scTestBtn"});
  var micDot=el("span",{className:"scMicDot"});
  micBtn.appendChild(micDot);
  micBtn.appendChild(el("span",{text:"测试麦克风"}));
  var micTested=false;
  micBtn.addEventListener("click",function(){
    micBtn.disabled=true;
    micBtn.innerHTML="";
    micDot=el("span",{className:"scMicDot"});
    micBtn.appendChild(micDot);
    micBtn.appendChild(el("span",{text:"录音中...请说话"}));
    try{
      STT.listen(5000).then(function(t){
        micTested=true;
        micBtn.innerHTML="";
        var d=el("span",{className:"scMicDot ready"});
        micBtn.appendChild(d);
        micBtn.appendChild(el("span",{text:t?"✓ 识别成功":"✓ 麦克风正常"}));
        micBtn.classList.add("ready");
        micBtn.disabled=false;
        checkReady();
      }).catch(function(){
        micBtn.innerHTML="";
        micBtn.appendChild(el("span",{className:"scMicDot ready"}));
        micBtn.appendChild(el("span",{text:"✓ 麦克风正常"}));
        micBtn.classList.add("ready");
        micBtn.disabled=false;
        checkReady();
      });
    }catch(e){
      micTested=true;
      micBtn.innerHTML="";
      micBtn.appendChild(el("span",{className:"scMicDot ready"}));
      micBtn.appendChild(el("span",{text:"✓ 麦克风正常"}));
      micBtn.classList.add("ready");
      micBtn.disabled=false;
      checkReady();
    }
  });
  testRow.appendChild(micBtn);
  screen.appendChild(testRow);
  root.appendChild(screen);
  /* 开始按钮 */
  var startBtn=el("button",{className:"primary fullWidth hidden",style:{fontSize:"17px",padding:"14px"},text:"✅ 试音完成，开始考试 →"});
  startBtn.addEventListener("click",callback);
  root.appendChild(el("div",{className:"btnRow"},[startBtn]));
  root.appendChild(el("p",{className:"center muted mt8",text:"请完成试音和麦克风测试后开始"}));
  function checkReady(){
    if(audioBtn.classList.contains("ready")&&micBtn.classList.contains("ready")){
      startBtn.classList.remove("hidden");
    }
  }
  /* 允许跳过试音 */
  var skipBtn=el("button",{className:"ghostBtn fullWidth mt8",text:"跳过试音 →"});
  skipBtn.addEventListener("click",callback);
  root.appendChild(el("div",{className:"btnRow"},[skipBtn]));
}

/* 自动倒计时：到0自动回调（含高考提示音：最后10秒滴答 + 结束音） */
function autoCountdown(cdEl,labelEl,seconds,onTick,onEnd,opts){
  opts=opts||{};
  var s=seconds;
  var firedTick={}; /* 防止同一秒重复触发 */
  if(cdEl)cdEl.textContent=fmtTime(s);
  SoundFX.unlock();
  var ti=setInterval(function(){
    s--;
    if(cdEl)cdEl.textContent=fmtTime(s>0?s:0);
    if(labelEl&&s<=10)labelEl.classList.add("warn");
    /* 高考提示音：最后10秒每秒一声"嘀"（可静音） */
    if(!opts.silent&&s>0&&s<=10&&!firedTick[s]){firedTick[s]=1;SoundFX.tick();}
    /* 5秒处提醒"嘟嘟" */
    if(!opts.silent&&s===5&&!firedTick["w5"]){firedTick["w5"]=1;SoundFX.beepWarn();}
    if(onTick)onTick(s);
    if(s<=0){
      clearInterval(ti);
      if(!opts.silent)SoundFX.beepEnd(); /* 结束"嘟嘟嘟" */
      if(onEnd)onEnd();
    }
  },1000);
  addExamTimer(ti);
  return ti;
}
/* 录音启动倒计时：高考为10秒准备+一声长"嘟"后开始录音 */
function recCountdown(cdEl,seconds,onReady,onEnd){
  var s=seconds;
  if(cdEl)cdEl.textContent=fmtTime(s);
  var ti=setInterval(function(){
    s--;
    if(cdEl)cdEl.textContent=fmtTime(s>0?s:0);
    if(s>0&&s<=10)SoundFX.tick();
    if(onReady)onReady(s);
    if(s<=0){
      clearInterval(ti);
      SoundFX.beepStart(); /* 一声长"嘟——"开始录音 */
      if(onEnd)onEnd();
    }
  },1000);
  addExamTimer(ti);
  return ti;
}

/* ============ Part A 引擎（严格高考时间） ============ */
/* 流程：指令播报 → 观看视频58s → 自主练习60s → 听录音 → 录音61s → 评分 */
function startPartA(item,isMock){
  enterExamMode(isMock);
  var root=$("#root .app");root.innerHTML="";
  var phase=0;
  var phaseNames=["指令","观看视频","自主练习","听录音","正式录音","评分"];
  function pbar(){var b=el("div",{className:"phaseBar"});phaseNames.forEach(function(n,i){b.appendChild(el("div",{className:(i===phase?"active ":(i<phase?"done ":""))+"phaseDot",text:(i+1)+". "+n}));});return b;}
  function header(){var frag=document.createDocumentFragment();frag.appendChild(examTopBar("Part A · 模仿朗读",isMock));var h=el("div",{className:"examTitle"});h.appendChild(el("span",{text:item.title}));h.appendChild(el("span",{className:"timer",text:"Part A · 20分"}));if(item.source)h.appendChild(el("span",{className:"srcLabel "+(isRealExam(item)?"real":"mock"),text:item.source}));frag.appendChild(h);return frag;}
  function statusBar(status,timer,recording){
    var bar=el("div",{className:"examStatusBar"+(recording?" recording":"")});
    var s=el("div",{className:"esbStatus"});
    s.appendChild(el("div",{className:"esbDot"}));
    s.appendChild(el("span",{text:status}));
    bar.appendChild(s);
    if(timer!=null)bar.appendChild(el("div",{className:"esbTimer"+(timer<=10?" warn":""),text:fmtTime(timer)}));
    return bar;
  }
  function updateStatusBar(status,timer,recording){
    var old=root.querySelector(".examStatusBar");
    if(old)old.replaceWith(statusBar(status,timer,recording));
  }

  /* Phase -1: 高考指令播报（真实考场：女声英文指导语） */
  function showInstruction(){
    clearExamTimers();
    root.innerHTML="";
    root.appendChild(header());
    var box=el("div",{className:"examWrap"});
    var ins=el("div",{className:"instrStage"});
    ins.appendChild(el("div",{className:"insPartTag",text:"PART A · READING ALOUD"}));
    ins.appendChild(el("h2",{className:"insTitle",text:"模仿朗读"}));
    ins.appendChild(el("div",{className:"insScoreTag",text:"满分 20 分"}));
    var body=el("div",{className:"insBody"});
    body.appendChild(el("p",{className:"insCn",text:"本题要求：观看视频，留意角色的言语和行为；然后模仿视频中的语音、语调，朗读一段英文独白。"}));
    body.appendChild(el("p",{className:"insEn",text:"In this part, you are required to watch a video clip and read after the speaker in the video."}));
    ins.appendChild(body);
    /* 播报动画 */
    var waveRow=el("div",{className:"recWaveRow"});
    for(var w=0;w<7;w++){var wi=el("i");wi.style.animationDelay=(w*0.12)+"s";waveRow.appendChild(wi);}
    ins.appendChild(waveRow);
    ins.appendChild(el("div",{className:"insStatus",text:"正在播报考试指令…"}));
    var skipBtn=el("button",{className:"ghostBtn",style:{marginTop:"14px"},text:"跳过播报，直接开始 →"});
    var skipped=false;
    skipBtn.addEventListener("click",function(){
      skipped=true;clearExamTimers();Speech.stop();
      phase=1;showVideo();
    });
    ins.appendChild(skipBtn);
    box.appendChild(ins);
    root.appendChild(box);
    /* 播报指令后自动开考 */
    SoundFX.ding();
    Speech.speak("In this part, you are required to watch a video clip and read after the speaker in the video.",{rate:0.85}).then(function(){
      if(skipped)return;
      var t=setTimeout(function(){if(!skipped){phase=1;showVideo();}},600);
      addExamTimer(t);
    });
  }

  /* Phase 0: 观看视频（58秒，带原声，自动播放，不可跳过） */
  function showVideo(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    var sbBar=statusBar("播放录像",58,false);
    root.appendChild(sbBar);
    var bp=el("div",{className:"bilingualPrompt"});
    bp.appendChild(el("div",{className:"bpCn",text:"请观看视频，注意语音语调和节奏。"}));
    bp.appendChild(el("div",{className:"bpEn",text:"Please watch the video clip and read after the speaker."}));
    root.appendChild(bp);
    var box=el("div",{className:"examWrap"});
    var stage=el("div",{className:"videoStage"});
    var overlay=el("div",{className:"vsOverlay"});
    overlay.appendChild(el("div",{className:"vsIcon",text:"🎬"}));
    var vsLabel=el("div",{className:"vsLabel",text:"点击播放视频"});
    overlay.appendChild(vsLabel);
    var playBtn=el("div",{className:"vsPlayBtn",text:"▶"});
    overlay.appendChild(playBtn);
    stage.appendChild(overlay);
    var subtitles=el("div",{className:"vsSubtitles"});
    stage.appendChild(subtitles);
    var progBar=el("div",{className:"vsProgress"});var progFill=el("div",{className:"vsProgressFill"});progBar.appendChild(progFill);stage.appendChild(progBar);
    box.appendChild(stage);
    box.appendChild(el("div",{className:"passage",text:item.text}));
    root.appendChild(box);
    /* 练习模式可跳过 */
    var pc=practiceControls(isMock,"Part A");
    if(pc)box.appendChild(pc);

    /* === 真题原视频模式：点开试题自动解压，播放高考原题视频 === */
    if(item._packVideo){
      var vid=el("video");
      vid.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;border-radius:12px;";
      vid.setAttribute("playsinline","");vid.setAttribute("webkit-playsinline","");
      vid.playsInline=true;
      stage.appendChild(vid);
      vsLabel.textContent="正在解压真题视频...";
      var unmuteBtn=el("button",{className:"primary",text:"🔊 点击开启声音"});
      unmuteBtn.style.cssText="position:absolute;top:10px;right:10px;z-index:6;display:none;padding:5px 12px;font-size:12px;";
      stage.appendChild(unmuteBtn);
      unmuteBtn.addEventListener("click",function(e){e.stopPropagation();vid.muted=false;unmuteBtn.style.display="none";});
      PackMgr.getMedia(item._packVideo.pack,item._packVideo.path).then(function(blob){
        vid.src=URL.createObjectURL(blob);
        vid.addEventListener("loadedmetadata",function(){
          vsLabel.textContent="高考原题视频 · "+Math.ceil(vid.duration)+"秒";
        });
        vid.addEventListener("timeupdate",function(){
          if(!vid.duration)return;
          var rem=Math.max(0,Math.ceil(vid.duration-vid.currentTime));
          updateStatusBar("播放录像",rem,false);
          progFill.style.width=Math.round(vid.currentTime/vid.duration*100)+"%";
        });
        vid.addEventListener("ended",function(){
          if(phase===1){phase=2;showRead();}
        });
        overlay.classList.add("playing");
        playBtn.style.display="none";
        stage.classList.add("playing");
        vid.play().catch(function(){
          /* 自动播放被拦截：静音重试 */
          vid.muted=true;
          vid.play().then(function(){
            unmuteBtn.style.display="block";
          }).catch(function(){
            /* 需手动点击 */
            overlay.classList.remove("playing");
            playBtn.style.display="flex";
            vsLabel.textContent="点击播放真题视频";
            var startReal=function(){
              overlay.classList.add("playing");
              playBtn.style.display="none";
              stage.classList.add("playing");
              vid.muted=false;
              vid.play().catch(function(){});
            };
            playBtn.onclick=startReal;
            overlay.onclick=startReal;
          });
        });
      }).catch(function(e){
        toast("真题视频解压失败，改用语音模式");
        startTTSFlow();
      });
    }else{
      startTTSFlow();
    }

    /* 语音模拟模式（无真题视频时） */
    function startTTSFlow(){
      var sentences=item.text.split(/([.!?])\s/).reduce(function(arr,s,i){if(i%2===0)arr.push(s);else arr[arr.length-1]+=s;return arr;},[]).filter(function(s){return s.trim();});
      var si=0;
      var totalSec=58;
      var videoStarted=false;
      var cdEl=root.querySelector(".esbTimer");

      function startVideoPlayback(){
        if(videoStarted)return;
        videoStarted=true;
        overlay.classList.add("playing");
        vsLabel.textContent="视频播放中...";
        playBtn.style.display="none";
        stage.classList.add("playing");
        autoCountdown(cdEl,null,totalSec,function(s){
          updateStatusBar("播放录像",s,false);
          progFill.style.width=Math.round((totalSec-s)/totalSec*100)+"%";
        },function(){
          if(phase===1){phase=2;showRead();}
        });
        playNext();
      }

      function playNext(){
        if(si>=sentences.length){subtitles.textContent="✓ 播放完成";return;}
        subtitles.textContent=sentences[si];
        subtitles.style.opacity="1";
        var spoken=Speech.speak(sentences[si],{rate:0.9});
        var estMs=Math.max(2000,sentences[si].length*90);
        var timer=setTimeout(function(){
          si++;playNext();
        },estMs);
        addExamTimer(timer);
        spoken.then(function(){
          clearTimeout(timer);
          if(si<sentences.length){si++;playNext();}
        });
      }

      playBtn.addEventListener("click",startVideoPlayback);
      overlay.addEventListener("click",startVideoPlayback);
      setTimeout(startVideoPlayback,500);
    }
  }

  /* Phase 2: 自主练习（60秒，高考指令同步播报） */
  function showRead(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    root.appendChild(statusBar("准备时间",60,false));
    var bp=el("div",{className:"bilingualPrompt"});
    bp.appendChild(el("div",{className:"bpCn",text:"现在你有一分钟的准备时间。"}));
    bp.appendChild(el("div",{className:"bpEn",text:"Now you have ONE minute to practise reading."}));
    root.appendChild(bp);
    var box=el("div",{className:"examWrap"});
    box.appendChild(el("div",{className:"passage",text:item.text}));
    root.appendChild(box);
    var pc=practiceControls(isMock,"Part A");
    if(pc)box.appendChild(pc);
    var cdEl=root.querySelector(".esbTimer");
    /* 高考指令播报（与倒计时并行，与真实考场一致） */
    SoundFX.ding();
    Speech.speak("Now you have one minute to practise reading.",{rate:0.85});
    autoCountdown(cdEl,null,60,function(s){updateStatusBar("准备时间",s,false);},function(){phase=3;showListen();});
  }

  /* Phase 3: 听录音（自动播放，播完自动推进） */
  function showListen(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    root.appendChild(statusBar("听语音",null,false));
    var bp=el("div",{className:"bilingualPrompt"});
    bp.appendChild(el("div",{className:"bpCn",text:"现在请对照原文，再听一遍录音。"}));
    bp.appendChild(el("div",{className:"bpEn",text:"Now listen to the speaker once again."}));
    root.appendChild(bp);
    var box=el("div",{className:"examWrap"});
    box.appendChild(el("div",{className:"passage",text:item.text}));
    root.appendChild(box);
    var pc=practiceControls(isMock,"Part A");
    if(pc)box.appendChild(pc);
    /* 高考指令播报：指令播完再放录音 */
    SoundFX.ding();
    var instrP=Speech.speak("Now listen to the speaker once again and pay attention to its rhythm and pronunciation.",{rate:0.85});
    /* 自动播放录音：真题模式重放原视频（对照原文听） */
    updateStatusBar("听语音",null,false);
    if(item._packVideo){
      var lvStage=el("div",{className:"videoStage"});
      lvStage.style.cssText="margin-bottom:12px;position:relative;aspect-ratio:16/9;";
      var lv=el("video");
      lv.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;border-radius:12px;";
      lv.setAttribute("playsinline","");lv.playsInline=true;
      lvStage.appendChild(lv);
      box.insertBefore(lvStage,box.firstChild);
      instrP.then(function(){
        return PackMgr.getMedia(item._packVideo.pack,item._packVideo.path);
      }).then(function(blob){
        lv.src=URL.createObjectURL(blob);
        lv.addEventListener("ended",function(){if(phase===3){phase=4;showPrepRecord();}});
        lv.play().catch(function(){
          lv.muted=true;
          lv.play().catch(function(){});
          var hb=el("button",{className:"primary",text:"▶ 点击播放"});
          hb.style.cssText="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;";
          hb.addEventListener("click",function(){lv.muted=false;hb.remove();});
          lvStage.appendChild(hb);
        });
      }).catch(function(){
        Speech.speak(item.text,{rate:0.92}).then(function(){
          if(phase===3){phase=4;showPrepRecord();}
        });
      });
    }else{
      instrP.then(function(){
        return Speech.speak(item.text,{rate:0.92});
      }).then(function(){
        if(phase===3){phase=4;showPrepRecord();}
      });
    }
    /* 练习模式可手动跳过 */
    if(!isMock){
      var skipBtn=el("button",{className:"primary mt8",text:"开始正式录音 →"});
      skipBtn.addEventListener("click",function(){if(phase===3){phase=4;showPrepRecord();}});
      box.appendChild(skipBtn);
    }
  }

  /* Phase 4: 录音指令（高考：播报"Now read as the speaker"后长"嘟"开始录音） */
  function showPrepRecord(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    root.appendChild(statusBar("录音指令",5,false));
    var bp=el("div",{className:"bilingualPrompt"});
    bp.appendChild(el("div",{className:"bpCn",text:"请模仿视频中的语音语调朗读。"}));
    bp.appendChild(el("div",{className:"bpEn",text:"Now read as the speaker in the video."}));
    root.appendChild(bp);
    var box=el("div",{className:"examWrap"});
    var prepCard=renderRecCard("录音准备...",5,"指令播报",false);
    box.appendChild(prepCard);
    root.appendChild(box);
    var pc=practiceControls(isMock,"Part A");
    if(pc)box.appendChild(pc);
    var cdEl=prepCard.querySelector(".rcTimer");
    var stEl=root.querySelector(".esbTimer");
    /* 高考流程：播报指令 → 长声"嘟" → 开始录音 */
    var started=false;
    function goRecord(){
      if(started)return;started=true;
      SoundFX.beepStart(); /* 一声长"嘟——" */
      phase=5;showRecord();
    }
    SoundFX.ding();
    Speech.speak("Now read as the speaker in the video.",{rate:0.85}).then(function(){
      var t=setTimeout(goRecord,500);addExamTimer(t);
    });
    /* 保底：8秒内未播完也强制进入 */
    var guard=setTimeout(goRecord,8000);addExamTimer(guard);
  }

  /* Phase 4: 正式录音（61秒，可提前结束，自动推进） */
  function showRecord(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    root.appendChild(statusBar("正在录音",61,true));
    var bp=el("div",{className:"bilingualPrompt"});
    bp.appendChild(el("div",{className:"bpCn",text:"现在开始录音。请对照原文朗读。"}));
    bp.appendChild(el("div",{className:"bpEn",text:"Now read as the speaker in the video."}));
    root.appendChild(bp);
    var box=el("div",{className:"examWrap"});
    /* 真题模式：录音时静音重放原视频（与高考考场一致） */
    if(item._packVideo){
      var rv=el("video");
      rv.style.cssText="width:100%;max-height:170px;object-fit:contain;background:#000;border-radius:10px;margin-bottom:10px;";
      rv.setAttribute("playsinline","");rv.playsInline=true;rv.muted=true;
      box.appendChild(rv);
      PackMgr.getMedia(item._packVideo.pack,item._packVideo.path).then(function(blob){
        rv.src=URL.createObjectURL(blob);
        rv.play().catch(function(){});
      }).catch(function(){});
    }
    box.appendChild(el("div",{className:"passage",text:item.text}));
    /* E听说风格：录音卡片 */
    var recCard=renderRecCard("正在录音...",61,"剩余录音时间",true);
    box.appendChild(recCard);
    var stopBtn=el("button",{className:"submitBtn fullWidth mt8",text:"■ 结束录音"});
    box.appendChild(stopBtn);
    root.appendChild(box);
    /* 练习模式可跳过/结算 */
    var pc=practiceControls(isMock,"Part A");
    if(pc)box.appendChild(pc);

    var sec=0,rp=null,sp=null,finished=false;
    var cdEl=recCard.querySelector(".rcTimer");
    var stEl=root.querySelector(".esbTimer");
    try{rp=Rec.record(61);}catch(e){rp=Promise.resolve(null);}
    try{sp=STT.listen(61000).catch(function(){return "";});}catch(e){sp=Promise.resolve("");}
    autoCountdown(cdEl,null,61,function(s){
      sec=61-s;
      if(cdEl)cdEl.textContent=fmtTime(s>0?s:0);
      if(stEl)stEl.textContent=fmtTime(s>0?s:0);
      if(s<=10)stEl.classList.add("warn");
    },function(){
      if(!finished){finished=true;finishRecord();}
    });
    stopBtn.addEventListener("click",function(){
      if(!finished){finished=true;finishRecord();}
    });
    function finishRecord(){
      clearExamTimers();
      recCard.classList.remove("recording");
      var rcStatus=recCard.querySelector(".rcStatus");
      if(rcStatus)rcStatus.textContent="录音结束 ✓";
      var rcWave=recCard.querySelector(".rcWave");
      if(rcWave)rcWave.style.display="none";
      updateStatusBar("录音结束",null,false);
      Promise.all([rp||Promise.resolve(null),sp||Promise.resolve("")]).then(function(arr){
        var r=scoreReading(arr[1],item.text);
        recordScore("A",item.id,r.score,20);
        if(State._mockCallback){
          toast("Part A: "+r.score+"/20 → 进入Part B");
          State._mockCallback(r.score);
        }else{
          phase=6;showScore(arr[0],arr[1]);
        }
      });
    }
  }

  /* Phase 5: 评分 + 逐词纠错（E听说风格） */
  function showScore(audioUrl,spokenText){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    var r=scoreReading(spokenText,item.text);
    var box=el("div",{className:"examWrap"});
    var pct=Math.round(r.score/20*100);
    var resClass=r.grade.level==="high"?"":r.grade.level==="mid"?"warn":"fail";
    /* E听说风格：评分对比卡 */
    box.appendChild(renderScoreCompare("A",item.id,r.score,20));
    /* 维度评分条 */
    box.appendChild(renderDimScore(r.dims));
    /* E听说风格：逐词颜色标注 */
    var evalTitle=el("div",{style:{marginTop:"14px",marginBottom:"6px"}});
    evalTitle.appendChild(el("h4",{style:{fontSize:"15px",fontWeight:"700"},text:"📝 逐词评估"}));
    box.appendChild(evalTitle);
    box.appendChild(renderWordEval(spokenText,item.text));
    /* 高频错误词 */
    if(r.missing&&r.missing.length){
      var errBox=el("div",{className:"correctionBox",style:{marginTop:"12px"}});
      errBox.appendChild(el("h4",{},[el("span",{text:"⚠️ "}),el("span",{text:"需重点练习的单词"})]));
      var errDiv=el("div",{className:"ciError"});
      r.missing.forEach(function(w){errDiv.appendChild(el("span",{className:"mw",text:w}));});
      errBox.appendChild(errDiv);
      var tipDiv=el("div",{className:"ciTip"});
      tipDiv.appendChild(el("strong",{text:"💡 建议："}));
      tipDiv.appendChild(el("span",{text:" 点击单词可听发音。绿色=正确，橙色=部分正确，灰色=未识别。反复练习标红/灰色的单词。"}));
      errBox.appendChild(tipDiv);
      box.appendChild(errBox);
    }
    if(r.transcript)box.appendChild(el("div",{className:"transcript",style:{marginTop:"12px"}},[el("strong",{text:"🎤 识别文本："}),el("br"),el("span",{text:r.transcript})]));
    if(audioUrl){var au=el("audio",{style:{width:"100%",marginTop:"10px"}});au.src=audioUrl;au.controls=true;box.appendChild(el("p",{className:"muted mt8",text:"录音回放："}));box.appendChild(au);}
    var br=el("div",{className:"btnRow"});
    br.appendChild(el("button",{className:"smallBtn",text:"重新朗读",onClick:function(){phase=4;showPrepRecord();}}));
    if(isMock){br.appendChild(el("button",{className:"primary",text:"完成 ✓",onClick:function(){toast("Part A: "+r.score+"/20");if(State._mockCallback)State._mockCallback(r.score);}}));}
    else{br.appendChild(el("button",{className:"primary",text:"完成 ✓",onClick:function(){if(State._mockCallback){toast("Part A: "+r.score+"/20 → 进入Part B");State._mockCallback(r.score);}else{toast("已记录成绩："+r.score+"/20");exitExamMode();State.view="home";State.subView=null;render();}}}));}
    box.appendChild(br);root.appendChild(box);
  }
  showInstruction();
}

/* ============ Part B 引擎（严格高考时间） ============ */
/* 流程：指令播报 → 情景30s → 听对话 → 三问(20s准备+嘟+10s录音)×3 → 五答(播问+嘟+10s录音)×5 → 评分 */
function startPartB(item,isMock){
  enterExamMode(isMock);
  var root=$("#root .app");root.innerHTML="";
  var phase=0;
  var phaseNames=["指令","情景","对话","三问","五答","结果"];
  var qScores=[],aScores=[];
  function pbar(){var b=el("div",{className:"phaseBar"});phaseNames.forEach(function(n,i){b.appendChild(el("div",{className:(i===phase?"active ":(i<phase?"done ":""))+"phaseDot",text:(i+1)+". "+n}));});return b;}
  function header(){var frag=document.createDocumentFragment();frag.appendChild(examTopBar("Part B · 角色扮演",isMock));var h=el("div",{className:"examTitle"});h.appendChild(el("span",{text:item.title}));h.appendChild(el("span",{className:"timer",text:"Part B · 16分"}));if(item.source)h.appendChild(el("span",{className:"srcLabel "+(isRealExam(item)?"real":"mock"),text:item.source}));frag.appendChild(h);return frag;}
  function statusBar(status,timer,recording){
    var bar=el("div",{className:"examStatusBar"+(recording?" recording":"")});
    var s=el("div",{className:"esbStatus"});
    s.appendChild(el("div",{className:"esbDot"}));
    s.appendChild(el("span",{text:status}));
    bar.appendChild(s);
    if(timer!=null)bar.appendChild(el("div",{className:"esbTimer"+(timer<=10?" warn":""),text:fmtTime(timer)}));
    return bar;
  }
  function updateStatusBar(status,timer,recording){var old=root.querySelector(".examStatusBar");if(old)old.replaceWith(statusBar(status,timer,recording));}

  /* Phase -1: 高考指令播报 */
  function showInstructionB(){
    clearExamTimers();
    root.innerHTML="";
    root.appendChild(header());
    var box=el("div",{className:"examWrap"});
    var ins=el("div",{className:"instrStage"});
    ins.appendChild(el("div",{className:"insPartTag",text:"PART B · ROLE PLAY"}));
    ins.appendChild(el("h2",{className:"insTitle",text:"角色扮演"}));
    ins.appendChild(el("div",{className:"insScoreTag",text:"满分 16 分"}));
    var body=el("div",{className:"insBody"});
    body.appendChild(el("p",{className:"insCn",text:"本题要求：扮演情景中的角色，聆听对话后，根据中文提示用英语提出3个问题，并回答计算机提出的5个问题。"}));
    body.appendChild(el("p",{className:"insEn",text:"In this part, you are required to act as a role and complete three questions and five answers in a conversation."}));
    ins.appendChild(body);
    var waveRow=el("div",{className:"recWaveRow"});
    for(var w=0;w<7;w++){var wi=el("i");wi.style.animationDelay=(w*0.12)+"s";waveRow.appendChild(wi);}
    ins.appendChild(waveRow);
    ins.appendChild(el("div",{className:"insStatus",text:"正在播报考试指令…"}));
    var skipped=false;
    var skipBtn=el("button",{className:"ghostBtn",style:{marginTop:"14px"},text:"跳过播报，直接开始 →"});
    skipBtn.addEventListener("click",function(){
      skipped=true;clearExamTimers();Speech.stop();
      phase=1;showScenario();
    });
    ins.appendChild(skipBtn);
    box.appendChild(ins);
    root.appendChild(box);
    SoundFX.ding();
    Speech.speak("In this part, you are required to act as a role and play a role in a conversation. Listen carefully and answer the questions.",{rate:0.85}).then(function(){
      if(skipped)return;
      var t=setTimeout(function(){if(!skipped){phase=1;showScenario();}},600);
      addExamTimer(t);
    });
  }

  /* Phase 1: 情景介绍（30秒，自动推进） */
  function showScenario(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    root.appendChild(statusBar("阅读情景",30,false));
    var bp=el("div",{className:"bilingualPrompt"});
    bp.appendChild(el("div",{className:"bpCn",text:"请阅读情景描述，记住角色身份和关键信息。"}));
    bp.appendChild(el("div",{className:"bpEn",text:"Read the scenario carefully."}));
    root.appendChild(bp);
    var box=el("div",{className:"examWrap"});
    box.appendChild(el("div",{className:"cnPrompt",text:item.scenario}));
    box.appendChild(el("p",{className:"muted",text:item.scenarioEn}));
    root.appendChild(box);
    var pc=practiceControls(isMock,"Part B");
    if(pc)box.appendChild(pc);
    var cdEl=root.querySelector(".esbTimer");
    SoundFX.ding();
    Speech.speak(item.scenarioEn||"Read the scenario carefully.",{rate:0.88});
    autoCountdown(cdEl,null,30,function(s){updateStatusBar("阅读情景",s,false);},function(){phase=2;showDialogue();});
  }

  /* Phase 1: 听对话（自动播放，播完自动推进） */
  function showDialogue(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    root.appendChild(statusBar("听对话",null,false));
    var bp=el("div",{className:"bilingualPrompt"});
    bp.appendChild(el("div",{className:"bpCn",text:"请聆听对话，留意人物、时间、地点、数量等关键信息。"}));
    bp.appendChild(el("div",{className:"bpEn",text:"Listen to the dialogue carefully."}));
    root.appendChild(bp);
    var box=el("div",{className:"examWrap"});
    item.dialogue.forEach(function(d){
      var isYou=d.role.toLowerCase().indexOf("tom")>=0||d.role.toLowerCase().indexOf("student")>=0||d.role.toLowerCase().indexOf("you")>=0;
      var chat=el("div",{className:"etsChatItem"+(isYou?" right":"")});
      var avatar=el("div",{className:"ciAvatar "+(isYou?"you":"computer"),text:d.role.charAt(0)});
      chat.appendChild(avatar);
      var bubble=el("div",{className:"ciBubble"});
      bubble.appendChild(el("div",{className:"ciEn",text:d.en}));
      bubble.appendChild(el("div",{className:"ciCn",text:d.cn}));
      chat.appendChild(bubble);
      box.appendChild(chat);
    });
    root.appendChild(box);
    var pc=practiceControls(isMock,"Part B");
    if(pc)box.appendChild(pc);
    /* 自动播放对话 */
    var ch=Promise.resolve();
    item.dialogue.forEach(function(d){ch=ch.then(function(){return Speech.speak(d.en,{rate:0.9});});});
    ch.then(function(){if(phase===2){phase=3;askQuestions();}});
    /* 练习模式可手动跳过听对话 */
    if(!isMock){
      var skipBtn=el("button",{className:"primary mt8",text:"跳过对话，开始提问 →"});
      skipBtn.addEventListener("click",function(){if(phase===2){phase=3;askQuestions();}});
      box.appendChild(skipBtn);
    }
  }

  /* Phase 2: 三问（每问20秒准备+10秒录音，自动推进） */
  var qi=0;
  function askQuestions(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    var box=el("div",{className:"examWrap"});
    if(qi>=item.questions.length){
      box.appendChild(el("p",{className:"muted",text:"三问完成！"}));
      root.appendChild(box);
      phase=4;ai=0;showAnswers();return;
    }
    root.appendChild(statusBar("准备提问",20,false));
    box.appendChild(el("p",{className:"muted mb8",text:"根据中文提示，用英语提出问题。"}));
    var q=item.questions[qi];
    var blk=el("div",{className:"qaBlock"});
    blk.appendChild(el("div",{className:"qlabel",text:"第"+(qi+1)+"问（共3问）· 准备时间20秒"}));
    blk.appendChild(el("div",{className:"qtext",text:q.cn}));
    blk.appendChild(el("div",{className:"atext",text:"参考句型："+q.en}));
    box.appendChild(blk);
    var cdBox=renderRecCard("准备提问...",20,"准备倒计时",false);
    box.appendChild(cdBox);
    root.appendChild(box);
    var pc=practiceControls(isMock,"Part B");
    if(pc)box.appendChild(pc);
    /* 20秒准备 → 自动开始10秒录音 */
    var cdEl=cdBox.querySelector(".rcTimer");
    var stEl=root.querySelector(".esbTimer");
    autoCountdown(cdEl,null,20,function(s){
      if(stEl)stEl.textContent=fmtTime(s>0?s:0);
      updateStatusBar("准备提问",s,false);
    },function(){
      /* 自动进入录音阶段 */
      recordQuestion(q,blk,cdBox);
    });
  }
  function recordQuestion(q,blk,cdBox){
    clearExamTimers();
    updateStatusBar("正在录音",10,true);
    blk.querySelector(".qlabel").textContent="第"+(qi+1)+"问 · 录音中（10秒）";
    if(cdBox)cdBox.remove();
    /* 高考流程：准备结束一声长"嘟"开始录音 */
    SoundFX.beepStart();
    /* E听说风格：录音卡片 */
    var recCard=renderRecCard("正在录音...",10,"录音倒计时",true);
    blk.appendChild(recCard);
    var stopBtn=el("button",{className:"submitBtn fullWidth mt8",text:"■ 结束录音"});
    blk.appendChild(stopBtn);
    var sp=null,finished=false;
    try{sp=STT.listen(10000).catch(function(){return "";});}catch(e){sp=Promise.resolve("");}
    var stEl=root.querySelector(".esbTimer");
    var cdEl=recCard.querySelector(".rcTimer");
    autoCountdown(cdEl,null,10,function(s){
      if(cdEl)cdEl.textContent=fmtTime(s>0?s:0);
      if(stEl)stEl.textContent=fmtTime(s>0?s:0);
      if(s<=10)stEl.classList.add("warn");
    },function(){
      if(!finished){finished=true;finishQuestion(q,sp,blk);}
    });
    stopBtn.addEventListener("click",function(){if(!finished){finished=true;finishQuestion(q,sp,blk);}});
  }
  function finishQuestion(q,sp,blk){
    clearExamTimers();
    updateStatusBar("录音结束",null,false);
    (sp||Promise.resolve("")).then(function(t){
      var s=scoreAnswer(t,q.en);
      qScores.push(s.score);
      blk.appendChild(el("div",{className:"transcript mt8",text:"识别："+t}));
      /* 高考流程：学生提问后，计算机回答 */
      updateStatusBar("计算机回答中",null,false);
      var ansBox=el("div",{className:"qaBlock mt8"});
      ansBox.appendChild(el("div",{className:"qlabel",text:"计算机回答："}));
      ansBox.appendChild(el("div",{className:"qtext",text:q.answer}));
      blk.appendChild(ansBox);
      /* 播放计算机回答音频 */
      Speech.speak(q.answer,{rate:0.9}).then(function(){
        qi++;askQuestions();
      });
      /* 练习模式可跳过计算机回答 */
      if(!isMock){
        var skipAns=el("button",{className:"ghostBtn mt8",text:"跳过回答 →"});
        skipAns.addEventListener("click",function(){
          Speech.stop();
          qi++;askQuestions();
        });
        blk.appendChild(skipAns);
      }
    });
  }

  /* Phase 3: 五答（每答10秒准备+10秒录音，自动推进） */
  var ai=0;
  function showAnswers(){
    clearExamTimers();
    root.innerHTML="";root.appendChild(pbar());root.appendChild(header());
    var box=el("div",{className:"examWrap"});
    if(ai>=item.fiveAnswers.length){finishB();return;}
    root.appendChild(statusBar("听问题",null,false));
    box.appendChild(el("p",{className:"muted mb8",text:"五答环节：聆听问题后回答。"}));
    var fa=item.fiveAnswers[ai];
    var blk=el("div",{className:"qaBlock"});
    blk.appendChild(el("div",{className:"qlabel",text:"第"+(ai+1)+"答（共5答）"}));
    blk.appendChild(el("div",{className:"qtext",text:fa.q}));
    box.appendChild(blk);
    root.appendChild(box);
    var pc=practiceControls(isMock,"Part B");
    if(pc)box.appendChild(pc);
    /* 自动播放问题 → 10秒准备 → 10秒录音 */
    Speech.speak(fa.q,{rate:0.9}).then(function(){
      if(phase!==4)return;
      updateStatusBar("准备回答",10,false);
      blk.querySelector(".qlabel").textContent="第"+(ai+1)+"答 · 准备回答（10秒）";
      var cdBox=renderRecCard("准备回答...",10,"准备倒计时",false);
      blk.appendChild(cdBox);
      var cdEl=cdBox.querySelector(".rcTimer");
      var stEl=root.querySelector(".esbTimer");
      autoCountdown(cdEl,null,10,function(s){
        if(stEl)stEl.textContent=fmtTime(s>0?s:0);
        updateStatusBar("准备回答",s,false);
      },function(){
        recordAnswer(fa,blk,cdBox);
      });
    });
  }
  function recordAnswer(fa,blk,cdBox){
    clearExamTimers();
    updateStatusBar("正在录音",10,true);
    blk.querySelector(".qlabel").textContent="第"+(ai+1)+"答 · 录音中（10秒）";
    if(cdBox)cdBox.remove();
    /* 高考流程：问题播完一声长"嘟"开始录音 */
    SoundFX.beepStart();
    /* E听说风格：录音卡片 */
    var recCard=renderRecCard("正在录音...",10,"录音倒计时",true);
    blk.appendChild(recCard);
    var stopBtn=el("button",{className:"submitBtn fullWidth mt8",text:"■ 结束录音"});
    blk.appendChild(stopBtn);
    var sp=null,finished=false;
    try{sp=STT.listen(10000).catch(function(){return "";});}catch(e){sp=Promise.resolve("");}
    var stEl=root.querySelector(".esbTimer");
    var cdEl=recCard.querySelector(".rcTimer");
    autoCountdown(cdEl,null,10,function(s){
      if(cdEl)cdEl.textContent=fmtTime(s>0?s:0);
      if(stEl)stEl.textContent=fmtTime(s>0?s:0);
    },function(){
      if(!finished){finished=true;finishAnswer(fa,sp,blk);}
    });
    stopBtn.addEventListener("click",function(){if(!finished){finished=true;finishAnswer(fa,sp,blk);}});
  }

/* 查找匹配题目：优先同来源，其次同话题，最后随机未做 */
function findMatching(item,targetPart){
  var data=DATA["part"+targetPart];
  if(item.source){
    var sameSource=data.filter(function(d){return d.source===item.source;});
    if(sameSource.length)return sameSource[0];
  }
  if(item.topic){
    var sameTopic=data.filter(function(d){return d.topic===item.topic;});
    if(sameTopic.length)return sameTopic[0];
  }
  var undone=data.filter(function(d){return !State.progress.done[d.id];});
  var pool=undone.length>0?undone:data;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* 链式练习：A→B→C连续完成，点击任意题目启动完整练习 */
function startChainPractice(selectedPart,item,isMock){
  var a=selectedPart==="A"?item:findMatching(item,"A");
  var b=selectedPart==="B"?item:findMatching(a,"B");
  var c=selectedPart==="C"?item:findMatching(b,"C");
  startChainWithItems(a,b,c,isMock);
}

function startExam(isMock,isRandom){
  var realA=DATA.partA.filter(isRealExam);var realB=DATA.partB.filter(isRealExam);var realC=DATA.partC.filter(isRealExam);
  var poolA=realA.length>=3?realA:DATA.partA;var poolB=realB.length>=3?realB:DATA.partB;var poolC=realC.length>=3?realC:DATA.partC;
  var a,b,c;
  if(isRandom){
    a=poolA[Math.floor(Math.random()*poolA.length)];b=poolB[Math.floor(Math.random()*poolB.length)];c=poolC[Math.floor(Math.random()*poolC.length)];
  }else{
    a=poolA[0];b=poolB[0];c=poolC[0];
  }
  startChainWithItems(a,b,c,isMock);
}

function startChainWithItems(a,b,c,isMock){
  var scores={A:0,B:0,C:0};
  var root=$("#root .app");
  /* 剩余时间中文播报（高考提示音体系：重要节点"叮"+播报） */
  function announceRemaining(mins,after){
    if(!isMock){if(after)after();return;}

  function tryGhPages(){var url=UPDATE_URL_GHPAGES+"?_t="+Date.now();return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("GH Pages HTTP "+r.status);return r.json();});}
  function tryRaw(){var url=UPDATE_URL_RAW+"?_t="+Date.now();return fetch(url,{cache:"no-store",redirect:"follow",headers:{Accept:"application/json, text/plain, */*"}}).then(function(r){if(!r.ok)throw Error("raw HTTP "+r.status);return r.json();});}
  function tryApi(){var url=UPDATE_URL_API+"?_t="+Date.now();return fetch(url,{cache:"no-store",headers:{Accept:"application/json, text/plain, */*","Accept-Language":"zh-CN,zh;q=0.9"}}).then(function(r){if(!r.ok)throw Error("API HTTP "+r.status);return r.json();}).then(function(n){if(n.content&&n.encoding==="base64"){return JSON.parse(decodeURIComponent(escape(atob(n.content))));}else if(n.versionCode)return n;throw Error("API格式无法识别");});}
  tryJsdelivr().catch(function(){return tryGhPages();}).catch(function(){return tryRaw();}).catch(function(){return tryApi();}).catch(function(){throw Error("检查更新失败，请检查网络");}).then(function(remote){
    if(typeof remote.versionCode!=="number")throw Error("versionCode无效");
    var hasUpdate=remote.versionCode>APP_VERSION_CODE;
    var changelog=remote.changelog||remote.updateLog||"";
    var ver=remote.version||remote.versionCode;
    var apkUrl=remote.apkUrl||remote.appUrl||(APK_MIRRORS[0]&&APK_MIRRORS[0].url);
    State.updateInfo={hasUpdate:hasUpdate,version:ver,versionCode:remote.versionCode,updateLog:changelog,changelog:changelog,apkUrl:apkUrl,appUrl:apkUrl,updating:false};
    if(!silent)State.updateStatus=hasUpdate?("发现新版本 v"+ver):"已是最新版本";
    if(silent&&hasUpdate){var dismissed=load(LSC.dismissed,"");if(String(ver)!==String(dismissed)){State.announce={version:ver,changelog:changelog};}}
    /* 静默更新：仅当本session未对该版本做过静默更新时才执行document.write */
    if(silent&&hasUpdate&&!_alreadySilentUpdated(ver)){
      _silentUpdateDone(ver); /* 标记，防止document.write后新页面再次静默更新 */
      function tryFetchHtml(idx){
        if(idx>=WEB_HTML_URLS.length){
          /* 所有源都失败，静默失败，用户可通过手动更新 */
          return;
        }
        /* 只用GitHub Raw做静默更新（即时生效，无CDN缓存问题） */
        if(idx===0){
          fetch(WEB_HTML_URLS[0]+"?_t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.text();}).then(function(t){
            if(t&&(t.includes("<!doctype")||t.includes("<html"))&&t.includes("APP_VERSION")){
              /* 验证获取的版本确实比当前新，防止CDN缓存旧版本导致降级 */
              var m=t.match(/APP_VERSION_CODE=(\d+)/);
              if(m&&parseInt(m[1])>APP_VERSION_CODE){
                document.open();document.write(t);document.close();
              }else{
                /* 获取到的是旧版本，跳过静默更新 */
                console.log("[Update] Fetched HTML is not newer, skip silent update");
              }
            }else{throw Error("content invalid");}
          }).catch(function(){tryFetchHtml(idx+1);});
        }else{
          tryFetchHtml(idx+1);
        }
      }
      tryFetchHtml(0);
    }
    State.updateChecking=false;State._skipScroll=true;render();
  }).catch(function(e){
    State.updateChecking=false;State.updateError=true;
    if(!silent)State.updateStatus="检查失败："+e.message;
    State.updateInfo=null;State._skipScroll=true;render();
  });
}
function doUpdate(){
  if(!State.updateInfo||!State.updateInfo.hasUpdate)return;
  /* 不调render()，直接在弹窗内显示更新状态，防止页面重建导致弹窗消失和跳转 */
  var overlay=$("#__updOverlay");
  if(overlay){
    /* 在弹窗内显示更新进度 */
    var modal=overlay.querySelector(".updateModal");
    if(modal){
      modal.innerHTML="";
      modal.appendChild(el("div",{style:{textAlign:"center",padding:"30px 20px"}},[
        el("div",{style:{fontSize:"40px",marginBottom:"16px"},text:"⏳"}),
        el("p",{style:{fontSize:"16px",fontWeight:"600",marginBottom:"8px"},text:"正在更新中..."}),
        el("p",{style:{fontSize:"13px",color:"var(--text-tertiary)"},text:"请勿关闭应用"})
      ]));
    }
  }
  State.updateInfo.updating=true;
  State.updateStatus="正在更新中...";
  /* 优先静默web更新（document.write），失败再打开APK下载 */
  function tryFetchHtml(idx){
    if(idx>=WEB_HTML_URLS.length){openApkDownload();return;}
    toast("正在从"+["GitHub Raw","jsdelivr CDN","GitHub Pages"][idx]+"获取更新...");
    fetch(WEB_HTML_URLS[idx]+"?_t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.text();}).then(function(t){
      if(t&&(t.includes("<!doctype")||t.includes("<html"))&&t.includes("APP_VERSION")){
        /* 验证版本确实更新，防止CDN缓存导致降级 */
        var m=t.match(/APP_VERSION_CODE=(\d+)/);
        if(m&&parseInt(m[1])>APP_VERSION_CODE){
          toast("正在应用更新...");
          _silentUpdateDone(State.updateInfo.version);
          document.open();document.write(t);document.close();
        }else{
          toast("获取到的版本不是最新，尝试下一个源...");
          throw Error("not newer");
        }
      }else{throw Error("内容无效");}
    }).catch(function(){tryFetchHtml(idx+1);});
  }
  function openApkDownload(){
    var info=State.updateInfo;var apkUrl=info.apkUrl||info.appUrl||(APK_MIRRORS[0]&&APK_MIRRORS[0].url);
    if(apkUrl){
      if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser){window.Capacitor.Plugins.Browser.open({url:apkUrl});}else{window.open(apkUrl,"_blank");}
      toast("已打开下载页面，请安装新版本APK");
    }else if(WEB_HTML_URL){window.open(WEB_HTML_URL,"_blank");}
  }
  tryFetchHtml(0);
}
function renderUpdateOverlay(){
  var old=$("#__updOverlay");if(old)old.remove();if(!State.announce)return;
  var a=State.announce;var ov=el("div",{id:"__updOverlay",className:"updateOverlay"});
  ov.addEventListener("click",function(e){if(e.target===e.currentTarget)closeAnnounce();});
  var modal=el("div",{className:"updateModal"});
  var hdr=el("div",{className:"updateModalHeader"});
  hdr.appendChild(el("div",{className:"updateModalIcon",text:"🚀"}));
  hdr.appendChild(el("p",{className:"updateModalTitle",text:"发现新版本"}));
  hdr.appendChild(el("p",{className:"updateModalSub",text:"快来体验最新功能吧"}));
  var ver=el("div",{className:"updateModalVersion"});ver.appendChild(el("span",{text:"v"+a.version}));ver.appendChild(el("span",{className:"updateModalBadge",text:"NEW"}));hdr.appendChild(ver);
  modal.appendChild(hdr);
  var body=el("div",{className:"updateModalBody"});body.appendChild(el("h4",{text:"更新内容"}));
  var ul=el("ul",{className:"updateModalList"});
  (a.changelog||"").split("\n").filter(function(l){return l.trim()&&!l.trim().startsWith("v")&&!l.trim().startsWith("【");}).forEach(function(l){var li=el("li",{});li.appendChild(el("span",{className:"updateModalDot"}));li.appendChild(el("span",{text:l.trim().replace(/^[-\d.]+\s*/,"")}));ul.appendChild(li);});
  if(!ul.children.length){var li2=el("li",{});li2.appendChild(el("span",{className:"updateModalDot"}));li2.appendChild(el("span",{text:"功能优化与问题修复"}));ul.appendChild(li2);}
  body.appendChild(ul);modal.appendChild(body);
  var footer=el("div",{className:"updateModalFooter"});
  var ghost=el("button",{className:"updateBtnGhost",text:"下次再说"});ghost.addEventListener("click",function(){save(LSC.dismissed,a.version);closeAnnounce();});footer.appendChild(ghost);
  var primary=el("button",{className:"updateBtnPrimary",text:"立即更新"});primary.addEventListener("click",function(){closeAnnounce();doUpdate();});footer.appendChild(primary);
  modal.appendChild(footer);ov.appendChild(modal);document.body.appendChild(ov);
}
function closeAnnounce(){State.announce=null;var o=$("#__updOverlay");if(o)o.remove();}

/* 初始化 */
function init(){
  PackMgr.loadPacks().then(function(){if(State.view==="practice")render();},function(){});
  render();
  setTimeout(function(){try{checkUpdate(true);}catch(e){}},1500);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
console.log("[App] v"+APP_VERSION+" code"+APP_VERSION_CODE);
  window.__pk={PackMgr:PackMgr,render:render};
})();
</script>
