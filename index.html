<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="广东高考英语听说练习软件 - 内置高考听说，模拟考试练习">
<title>广东高考英语听说</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--primary-bg:#eff6ff;
  --bg:#f5f6f8;--bg-card:#ffffff;--bg-secondary:#f1f5f9;--bg-tertiary:#f8fafc;
  --text:#111827;--text-secondary:#4b5563;--text-tertiary:#9ca3af;
  --border:#e5e7eb;--border-light:#f3f4f6;
  --danger:#ef4444;--warning:#f59e0b;--success:#16a34a;
  --score-high:#3b82f6;--score-mid:#f59e0b;--score-low:#ef4444;
  --radius:16px;--shadow:0 2px 12px rgba(0,0,0,.06);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px}
.app{max-width:680px;margin:0 auto;padding:14px 14px calc(86px + var(--safe-bottom));min-height:100vh}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--text-secondary);font-size:13px}
.card{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.primary{background:var(--primary);color:#fff;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:600;transition:transform .12s,background .15s;display:inline-block}
.primary:active{transform:scale(.97)}
.primary:disabled{opacity:.55;cursor:not-allowed}
.smallBtn{background:var(--bg-secondary);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;border:1px solid var(--border);transition:all .15s;display:inline-block}
.smallBtn:active{transform:scale(.96)}
.dangerGhost{background:transparent;border:1px solid #fecaca;color:var(--danger)}
.fullWidth{width:100%;text-align:center}
.status{color:var(--text-secondary);font-size:13px;background:var(--bg-secondary);border-radius:10px;padding:8px 12px;margin-top:8px;word-break:break-all}
/* header */
.topBar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.topBar h1{font-size:22px}
.versionPill{background:var(--primary-light);color:var(--primary-dark);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
/* hero banner */
.heroBanner{background:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);border-radius:20px;padding:20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(37,99,235,.2)}
.heroBanner h2{color:#fff;font-size:20px;margin-bottom:4px}
.heroBanner p{opacity:.9;font-size:13px;margin-bottom:12px}
.heroStats{display:flex;gap:16px}
.heroStat{text-align:center}
.heroStat .hv{font-size:22px;font-weight:800}
.heroStat .hl{font-size:11px;opacity:.85}
/* practice part cards */
.partGrid{display:grid;gap:12px}
.partCard{background:var(--bg-card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s}
.partCard:active{transform:scale(.99)}
.partCard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.partA::before{background:#3b82f6}
.partB::before{background:#8b5cf6}
.partC::before{background:#10b981}
.partHead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.partIcon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;flex-shrink:0}
.partA .partIcon{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.partB .partIcon{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.partC .partIcon{background:linear-gradient(135deg,#10b981,#059669)}
.partTitle{font-size:17px;font-weight:700}
.partSub{color:var(--text-secondary);font-size:12px}
.partMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{background:var(--bg-secondary);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--text-secondary)}
.tag.score{background:#dcfce7;color:#166534}
.tag.diff-easy{background:#dcfce7;color:#166534}
.tag.diff-medium{background:#fef3c7;color:#92400e}
.tag.diff-hard{background:#fee2e2;color:#991b1b}
/* difficulty filter */
.diffFilter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.diffChip{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);transition:all .15s}
.diffChip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* resource list */
.resListItem{background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:transform .12s}
.resListItem:active{transform:scale(.99)}
.resListIcon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff;flex-shrink:0}
.resListBody{flex:1;min-width:0}
.resListTitle{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resListSub{font-size:12px;color:var(--text-secondary)}
.resListDone{width:24px;height:24px;border-radius:50%;background:#dcfce7;display:grid;place-items:center;font-size:14px;flex-shrink:0}
/* mock banner */
.mockBanner{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 6px 20px rgba(37,99,235,.25)}
.mockBanner h2{color:#fff;margin-bottom:4px}
.mockBanner p{opacity:.92;font-size:13px;margin-bottom:14px}
.mockBanner .primary{background:#fff;color:var(--primary-dark)}
/* exam engine */
.examWrap{background:var(--bg-card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.phaseBar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.phaseDot{flex:1;min-width:60px;text-align:center;font-size:11px;color:var(--text-tertiary);padding:6px 4px;border-radius:10px;background:var(--bg-secondary);font-weight:600}
.phaseDot.active{background:var(--primary);color:#fff}
.phaseDot.done{background:#dcfce7;color:#166534}
.examTitle{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timer{background:#fef3c7;color:#92400e;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.passage{background:var(--bg-tertiary);border-radius:12px;padding:16px;font-size:17px;line-height:2;letter-spacing:.01em}
.passage .hl{color:var(--primary);font-weight:600}
.passage .miss{color:var(--score-low);text-decoration:underline wavy}
.keywordRow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.kw{background:var(--primary-bg);color:var(--primary-dark);border:1px solid #bfdbfe;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.kw small{color:var(--text-secondary);font-weight:400;margin-left:4px}
.qaBlock{background:var(--bg-tertiary);border-radius:12px;padding:14px;margin:10px 0}
.qaBlock .qlabel{font-size:12px;color:var(--text-tertiary);font-weight:700;margin-bottom:4px}
.qaBlock .qtext{font-size:15px;font-weight:600;margin-bottom:6px}
.qaBlock .atext{font-size:14px;color:var(--text-secondary)}
.cnPrompt{background:#fffbeb;border-left:3px solid var(--warning);border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0}
.recBar{display:flex;align-items:center;gap:12px;background:var(--bg-secondary);border-radius:14px;padding:12px 14px;margin-top:14px}
.recDot{width:14px;height:14px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.recBar.recording{background:#fef2f2}
/* score display - three color system */
.resultBox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:12px}
.resultBox.warn{background:#fffbeb;border-color:#fde68a}
.resultBox.fail{background:#fef2f2;border-color:#fecaca}
.scoreBig{font-size:36px;font-weight:800;color:var(--success)}
.scoreBig.warn{color:var(--warning)}
.scoreBig.fail{color:var(--danger)}
.scoreGrade{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px}
.scoreGrade.high{background:#dbeafe;color:#1d4ed8}
.scoreGrade.mid{background:#fef3c7;color:#92400e}
.scoreGrade.low{background:#fee2e2;color:#991b1b}
.dimRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.dimCard{background:#fff;border-radius:10px;padding:10px;text-align:center}
.dimCard .dv{font-size:20px;font-weight:800}
.dimCard .dv.high{color:var(--score-high)}
.dimCard .dv.mid{color:var(--score-mid)}
.dimCard .dv.low{color:var(--score-low)}
.dimCard .dl{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.dimBar{height:6px;border-radius:3px;background:var(--bg-secondary);margin-top:6px;overflow:hidden}
.dimBarFill{height:100%;border-radius:3px;transition:width .5s}
.audioBtn{display:inline-flex;align-items:center;gap:6px;background:var(--primary-bg);color:var(--primary-dark);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid #bfdbfe}
.audioBtn:active{transform:scale(.96)}
.audioBtn.playing{background:var(--primary);color:#fff}
.audioBtn:disabled{opacity:.5}
.btnRow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btnRow .primary{flex:1;text-align:center}
.transcript{background:var(--bg-tertiary);border-radius:10px;padding:12px;font-size:13px;color:var(--text-secondary);margin-top:10px;max-height:160px;overflow-y:auto;line-height:1.7}
.missWords{margin-top:8px}
.missWords .mw{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px}
/* resources */
.searchBox{display:flex;gap:8px;margin-bottom:14px}
.searchBox input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;outline:none}
.searchBox input:focus{border-color:var(--primary)}
.resCard{background:var(--bg-card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.resCard .ri{flex:1;min-width:0}
.resCard h3{font-size:15px;margin-bottom:2px}
.resCard p{font-size:12px;color:var(--text-secondary)}
.resTag{background:var(--primary-light);color:var(--primary-dark);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;flex-shrink:0}
/* error book */
.errItem{background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.errItem .eiHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.errItem .eiPart{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.errItem .eiPart.A{background:#dbeafe;color:#1d4ed8}
.errItem .eiPart.B{background:#ede9fe;color:#6d28d9}
.errItem .eiPart.C{background:#d1fae5;color:#047857}
.errItem .eiTitle{font-size:14px;font-weight:600;margin-bottom:4px}
.errItem .eiDetail{font-size:13px;color:var(--text-secondary)}
.errItem .eiScore{font-size:13px;font-weight:700}
/* stats charts */
.chartBar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chartBar .cbLabel{width:60px;font-size:12px;color:var(--text-secondary);text-align:right;flex-shrink:0}
.chartBar .cbTrack{flex:1;height:24px;background:var(--bg-secondary);border-radius:8px;overflow:hidden;position:relative}
.chartBar .cbFill{height:100%;border-radius:8px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:700}
.chartBar .cbVal{width:36px;font-size:13px;font-weight:700;flex-shrink:0}
/* settings / me */
.meHeader{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.meAvatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:grid;place-items:center;font-size:28px;color:#fff;flex-shrink:0;box-shadow:0 4px 16px rgba(37,99,235,.3)}
.section{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.section h3{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-light)}
.row:last-child{border-bottom:none}
.row .rl{color:var(--text-secondary);font-size:14px}
.row .rv{font-weight:600;font-size:14px}
.cloudUpdateSection{background:var(--primary-bg);border:1px solid #bfdbfe;border-radius:18px;padding:14px;margin-bottom:12px;word-break:break-all;overflow:hidden}
.cloudUpdateSection h3{color:var(--primary-dark);font-size:16px;margin-bottom:6px}
.updateInfoBox{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;margin-top:10px;padding:12px;word-break:break-all;overflow:hidden}
.updateNewVersion{color:var(--primary);font-size:15px;font-weight:600;margin-bottom:6px}
.updateLog{color:var(--text-secondary);background:var(--bg);white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;border-radius:8px;margin:0;padding:8px;font-size:13px;font-family:inherit}
.updateLatest{color:var(--text-tertiary);font-weight:600}
.feedbackSec{background:#fffbeb;border:1px solid #fde68a;border-radius:18px;padding:14px;margin-bottom:12px}
.feedbackSec h3{color:#92400e;font-size:16px;margin-bottom:6px}
.statGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.statCard{background:var(--bg-card);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.statCard .sn{font-size:24px;font-weight:800;color:var(--primary)}
.statCard .sl{font-size:11px;color:var(--text-tertiary);margin-top:2px}
/* daily recommendation */
.dailyCard{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border:1px solid #bfdbfe;border-radius:16px;padding:16px;margin-bottom:14px}
.dailyCard h3{color:var(--primary-dark);margin-bottom:8px}
.dailyCard .dailyItem{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border-radius:10px;margin-top:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.dailyCard .dailyItem:active{transform:scale(.99)}
.dailyCard .dailyIcon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:16px;color:#fff;flex-shrink:0}
/* tabbar */
.tabbar{position:fixed;left:50%;bottom:max(10px,var(--safe-bottom));transform:translateX(-50%);width:min(520px,calc(100vw - 16px));background:#f0f7fff2;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #3b82f61f;border-radius:22px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;box-shadow:0 -4px 24px rgba(37,99,235,.08),0 8px 32px rgba(0,0,0,.06);z-index:50}
.tabbar button{color:var(--text-tertiary);background:transparent;border-radius:14px;padding:7px 2px;font-size:10px;display:grid;place-items:center;gap:2px;transition:all .2s;white-space:nowrap;overflow:hidden}
.tabbar button.active{background:var(--primary);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.35)}
.tabIcon{width:22px;height:22px;display:flex;justify-content:center;align-items:center;line-height:1}
.tabLabel{font-size:10px}
/* update overlay */
.updateOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1000;display:grid;place-items:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.updateModal{background:var(--bg-card);border-radius:20px;width:100%;max-width:400px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.3);animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.updateModalHeader{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-align:center;padding:24px 20px 20px}
.updateModalIcon{font-size:40px;margin-bottom:8px}
.updateModalTitle{font-size:20px;font-weight:700;margin-bottom:4px}
.updateModalSub{font-size:13px;opacity:.9}
.updateModalVersion{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:20px;padding:6px 14px;font-size:15px;font-weight:700;margin-top:12px}
.updateModalBadge{background:#f59e0b;color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}
.updateModalBody{flex:1;padding:20px;overflow-y:auto}
.updateModalBody h4{color:var(--text-secondary);font-size:14px;font-weight:600;margin-bottom:12px}
.updateModalList{list-style:none;padding:0;margin:0}
.updateModalList li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:14px;line-height:1.6;border-bottom:1px solid var(--border-light)}
.updateModalList li:last-child{border-bottom:none}
.updateModalDot{background:var(--primary);border-radius:50%;width:6px;height:6px;flex-shrink:0;margin-top:8px}
.updateModalFooter{display:flex;gap:10px;padding:16px 20px 20px;border-top:1px solid var(--border-light)}
.updateBtnPrimary{flex:1;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;transition:transform .15s}
.updateBtnPrimary:active{transform:scale(.97)}
.updateBtnGhost{background:transparent;border:none;color:var(--text-secondary);border-radius:12px;padding:12px 16px;font-size:14px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-bottom));transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:2000;animation:fadeIn .2s;max-width:90vw;text-align:center}
.hidden{display:none!important}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.emptyState{text-align:center;padding:40px 20px;color:var(--text-tertiary)}
.emptyState .ei{font-size:48px;margin-bottom:10px}
@media(max-width:380px){.app{padding:10px}.dimRow{grid-template-columns:1fr 1fr}}
</style>
</head>

function $(s,p){return (p||document).querySelector(s);}
function el(tag,props,children){
  var e=document.createElement(tag);
  if(props)for(var k in props){
    if(k==="className")e.className=props[k];
    else if(k==="style"&&typeof props[k]==="object")Object.assign(e.style,props[k]);
    else if(k==="onClick")e.addEventListener("click",props[k]);
    else if(k==="html")e.innerHTML=props[k];
    else if(k==="text")e.textContent=props[k];
    else e.setAttribute(k,props[k]);
  }
  if(children){(Array.isArray(children)?children:[children]).forEach(function(c){
    if(c==null)return; e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });}
  return e;
}
function fmtTime(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60);return m+":"+(s%60<10?"0":"")+(s%60);}

/* ---------- 语音引擎 ---------- */
var Speech={};
Speech.supported=function(){return "speechSynthesis" in window;};
Speech.speak=function(text,opts){
  opts=opts||{};
  if(!Speech.supported()){toast("当前浏览器不支持语音合成");return Promise.resolve();}
  return new Promise(function(resolve){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=opts.rate||0.95; u.pitch=opts.pitch||1;
    var v=Speech._enVoice;
    if(!v){var vs=window.speechSynthesis.getVoices();v=vs.filter(function(x){return /en[-_]US/i.test(x.lang);})[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];Speech._enVoice=v;}
    if(v)u.voice=v;
    u.onend=resolve; u.onerror=resolve;
    window.speechSynthesis.speak(u);
  });
};
Speech.stop=function(){if(Speech.supported())window.speechSynthesis.cancel();};
if(Speech.supported()){window.speechSynthesis.onvoiceschanged=function(){Speech._enVoice=null;};}

/* 语音识别 */
var STT={};
STT.supported=function(){return ("SpeechRecognition" in window)||("webkitSpeechRecognition" in window);};
STT.create=function(opts){
  opts=opts||{};
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  var r=new SR();
  r.lang="en-US"; r.continuous=opts.continuous!==false; r.interimResults=opts.interim||false;
  return r;
};
STT.listen=function(timeout){
  return new Promise(function(resolve,reject){
    var r=STT.create({continuous:true,interim:true});
    if(!r){reject(new Error("不支持语音识别"));return;}
    var finalText="",tmr=null;
    r.onresult=function(e){
      var txt="";
      for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)txt+=e.results[i][0].transcript+" ";else txt+=e.results[i][0].transcript;}
      finalText=txt.trim();
    };
    r.onerror=function(e){clearTimeout(tmr);reject(new Error("识别失败："+e.error));};
    r.onend=function(){clearTimeout(tmr);resolve(finalText);};
    r.start();
    tmr=setTimeout(function(){try{r.stop();}catch(e){}},timeout||60000);
  });
};

/* 录音 */
var Rec={};
Rec.supported=function(){return "MediaRecorder" in window && navigator.mediaDevices;};
Rec.record=function(seconds){
  return new Promise(function(resolve,reject){
    if(!Rec.supported()){reject(new Error("不支持录音"));return;}
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var chunks=[],mr=new MediaRecorder(stream);
      mr.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data);};
      mr.onstop=function(){stream.getTracks().forEach(function(t){t.stop();});resolve(URL.createObjectURL(new Blob(chunks,{type:"audio/webm"})));};
      mr.onerror=function(e){reject(e);};
      mr.start();
      setTimeout(function(){if(mr.state!=="inactive")mr.stop();},(seconds||60)*1000);
    }).catch(function(e){reject(e);});
  });
};

/* ---------- 评分（三色系统 + 多维度） ---------- */
function scoreGrade(pct){
  if(pct>=80)return {level:"high",label:"优秀",color:"#3b82f6"};
  if(pct>=65)return {level:"mid",label:"良好",color:"#f59e0b"};
  return {level:"low",label:"待提高",color:"#ef4444"};
}
function scoreReading(spokenText,referenceText){
  if(!spokenText||!spokenText.trim())return {score:0,coverage:0,fluency:0,accuracy:0,transcript:"",missing:[],grade:scoreGrade(0)};
  var spoken=spokenText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var ref=referenceText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var refSet={};ref.forEach(function(w){refSet[w]=1;});
  var spokenSet={};spoken.forEach(function(w){spokenSet[w]=1;});
  var hit=0;ref.forEach(function(w){if(spokenSet[w])hit++;});
  var coverage=ref.length?Math.round(hit/ref.length*100):0;
  var fluency=Math.min(100,Math.round(spoken.length/Math.max(8,ref.length*0.7)*100));
  var accuracy=Math.min(100,coverage+10);
  var score=Math.round((coverage*0.4+fluency*0.3+accuracy*0.3)/5);
  score=Math.max(0,Math.min(20,score));
  var missing=ref.filter(function(w,i,arr){return !spokenSet[w] && arr.indexOf(w)===i;}).slice(0,8);
  var pct=Math.round(score/20*100);
  return {score:score,coverage:coverage,fluency:Math.min(100,fluency),accuracy:Math.min(100,accuracy),transcript:spokenText,missing:missing,grade:scoreGrade(pct)};
}
function scoreAnswer(spokenText,referenceAnswer){
  if(!spokenText||!spokenText.trim())return {score:0,ok:false,transcript:"",matchRatio:0,grade:scoreGrade(0)};
  var spoken=spokenText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var ref=(referenceAnswer||"").toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  if(!ref.length)return {score:1,ok:true,transcript:spokenText,matchRatio:100,grade:scoreGrade(100)};
  var refSet={};ref.forEach(function(w){if(w.length>2)refSet[w]=1;});
  var hit=0;Object.keys(refSet).forEach(function(w){if(spoken.indexOf(w)>=0)hit++;});
  var ratio=Object.keys(refSet).length?hit/Object.keys(refSet).length:1;
  var sc=ratio>=0.5?2:(ratio>=0.2?1:0);
  return {score:sc,ok:ratio>=0.4,transcript:spokenText,matchRatio:Math.round(ratio*100),grade:scoreGrade(ratio*100)};
}
function scoreRetell(spokenText,keywords,storyText){
  if(!spokenText||!spokenText.trim())return {score:0,coverage:0,kwHit:0,transcript:"",grade:scoreGrade(0)};
  var spoken=spokenText.toLowerCase();
  var spokenWords=spoken.replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var storyWords=storyText.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var storySet={};storyWords.forEach(function(w){if(w.length>3)storySet[w]=1;});
  var kwHit=0;keywords.forEach(function(k){if(spoken.indexOf(k.en.toLowerCase())>=0)kwHit++;});
  var spokenHit=0;Object.keys(storySet).forEach(function(w){if(spokenWords.indexOf(w)>=0)spokenHit++;});
  var coverage=storySet.length?Math.round(spokenHit/Object.keys(storySet).length*100):0;
  var kwPct=keywords.length?Math.round(kwHit/keywords.length*100):0;
  var score=Math.round((coverage*0.4+kwPct*0.4+Math.min(100,spokenWords.length*3)*0.2)/100*24);
  score=Math.max(0,Math.min(24,score));
  return {score:score,coverage:coverage,kwHit:kwHit,kwTotal:keywords.length,transcript:spokenText,grade:scoreGrade(score/24*100)};
}

function recordScore(part,id,score,max){
  State.scores.push({part:part,id:id,score:score,max:max,date:Date.now()});
  if(State.scores.length>500)State.scores=State.scores.slice(-500);
  save(LSC.scores,State.scores);
  if(score/max<0.6){
    var item=DATA["part"+part].filter(function(d){return d.id===id;})[0];
    if(item)addError(part,item,score,max);
  }
  State.progress.done[id]={score:score,max:max,date:Date.now()};
  save(LSC.progress,State.progress);
}
function avgScore(part){
  var s=State.scores.filter(function(x){return x.part===part;});
  if(!s.length)return null;
  return Math.round(s.reduce(function(a,b){return a+b.score;},0)/s.length*10)/10;
}
function totalDone(){return Object.keys(State.progress.done).length;}
function partDone(part){
  return DATA["part"+part].filter(function(d){return State.progress.done[d.id];}).length;
}

    box.appendChild(el("p",{className:"muted mb8",text:"聆听以下对话，留意关键信息（人物、时间、数量等）。可点击播放。"}));

      blk.appendChild(el("div",{className:"qlabel",text:d.role}));
      blk.appendChild(el("div",{className:"qtext",text:d.en}));
      blk.appendChild(el("div",{className:"atext",text:d.cn}));
      box.appendChild(blk);
    });
    var playBtn=el("button",{className:"audioBtn mt8",text:"▶ 播放对话"});
    playBtn.addEventListener("click",function(){
      playBtn.disabled=true;playBtn.textContent="播放中...";
      var ch=Promise.resolve();
      item.dialogue.forEach(function(d){ch=ch.then(function(){return Speech.speak(d.en,{rate:0.9});});});

  var qi=0,qScores=[];
  function askQuestions(){
    root.innerHTML="";
    root.appendChild(pbar());
    root.appendChild(header());
    var box=el("div",{className:"examWrap"});
    box.appendChild(el("p",{className:"muted mb8",text:"根据中文提示，用英语提出以下问题。点击口述按钮进行语音作答。"}));
    if(qi>=item.questions.length){
      box.appendChild(el("p",{className:"muted",text:"三问完成！进入五答环节。"}));
      box.appendChild(el("div",{className:"btnRow"},[el("button",{className:"primary",text:"进入五答 →",onClick:function(){phase=3;showAnswers();}})]));

    }

    blk.appendChild(el("div",{className:"qlabel",text:"第"+(qi+1)+"问（共3问）"}));
    blk.appendChild(el("div",{className:"qtext",text:q.cn}));
    blk.appendChild(el("div",{className:"atext",text:"参考句型："+q.en}));
    box.appendChild(blk);
    var b=el("button",{className:"smallBtn mt8",text:"🎤 口述提问（自动识别）"});
    b.addEventListener("click",function(){
      b.disabled=true;b.textContent="识别中...";
      STT.listen(12000).then(function(t){
        var s=scoreAnswer(t,q.en);
        qScores.push(s.score);
        var pct=Math.round(s.matchRatio);
        var g=scoreGrade(pct);
        b.textContent="✓ "+s.score+"/2分 ("+g.label+")";
        b.style.background=g.color;b.style.color="#fff";
        blk.appendChild(el("div",{className:"transcript mt8",text:"识别："+t}));
        blk.appendChild(el("div",{className:"muted mt8",text:"参考答案："+q.answer}));
        var playAns=el("button",{className:"audioBtn mt8",text:"▶ 听参考回答"});
        playAns.addEventListener("click",function(){playAns.disabled=true;Speech.speak(q.answer,{rate:0.9}).then(function(){playAns.disabled=false;});});
        blk.appendChild(playAns);
        var nextBtn=el("button",{className:"primary mt8",text:qi<2?"下一问 →":"进入五答 →"});
        nextBtn.addEventListener("click",function(){qi++;askQuestions();});
        blk.appendChild(nextBtn);
      }).catch(function(e){
        b.disabled=false;b.textContent="🎤 重新口述";
        toast("识别失败，请重试");
      });
    });
    box.appendChild(b);
    root.appendChild(box);
  }
  var ai=0,aScores=[];
  function showAnswers(){
    root.innerHTML="";
    root.appendChild(pbar());
    root.appendChild(header());
    var box=el("div",{className:"examWrap"});
    box.appendChild(el("p",{className:"muted mb8",text:"以下为「五答」环节。聆听问题后口述回答。"}));
    if(ai>=item.fiveAnswers.length){
      var qs=qScores.reduce(function(a,b){return a+b;},0);
      var as=aScores.reduce(function(a,b){return a+b;},0);
      var t=Math.min(16,qs+as);
      phase=4;
      root.innerHTML="";
      root.appendChild(pbar());
      root.appendChild(header());
      var rBox=el("div",{className:"examWrap"});
      var pct=Math.round(t/16*100);
      var g=scoreGrade(pct);
      var resBox=el("div",{className:"resultBox "+(g.level==="high"?"":g.level==="mid"?"warn":"fail")});
      resBox.appendChild(el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},[
        el("div",{style:{display:"flex",alignItems:"baseline",gap:"8px"}},[
          el("span",{className:"scoreBig "+(g.level==="high"?"":g.level==="mid"?"warn":"fail"),text:t+""}),
          el("span",{style:{fontSize:"16px",color:"#6b7280",fontWeight:"600"},text:"/ 16分"})
        ]),
        el("span",{className:"scoreGrade "+g.level,text:g.label+" "+pct+"%"})
      ]));
      var dimRow=el("div",{className:"dimRow"});
      var qPct=Math.round(qs/6*100),aPct=Math.round(as/10*100);
      [["三问",qPct],["五答",aPct],["总评",pct]].forEach(function(d){
        var dg=scoreGrade(d[1]);
        var dc=el("div",{className:"dimCard"});
        dc.appendChild(el("div",{className:"dv "+dg.level,text:d[1]+"%"}));
        dc.appendChild(el("div",{className:"dl",text:d[0]}));
        var bar=el("div",{className:"dimBar"});
        var fill=el("div",{className:"dimBarFill"});
        fill.style.width=d[1]+"%";fill.style.background=dg.color;
        bar.appendChild(fill);dc.appendChild(bar);dimRow.appendChild(dc);
      });
      resBox.appendChild(dimRow);
      rBox.appendChild(resBox);
      rBox.appendChild(el("div",{className:"btnRow"},[
        el("button",{className:"smallBtn",text:"重新练习",onClick:function(){qi=0;ai=0;qScores=[];aScores=[];phase=0;showScenario();}}),
        el("button",{className:"primary",text:"完成 ✓",onClick:function(){
          recordScore("B",item.id,t,16);
          toast("已记录成绩："+t+"/16");
          State.subView="listB";render();
        }})
      ]));
      root.appendChild(rBox);
      return;
    }
    var fa=item.fiveAnswers[ai];
    var blk=el("div",{className:"qaBlock"});
    blk.appendChild(el("div",{className:"qlabel",text:"第"+(ai+1)+"答（共5答）"}));
    blk.appendChild(el("div",{className:"qtext",text:fa.q}));
    box.appendChild(blk);
    var pb=el("button",{className:"audioBtn mt8",text:"▶ 听问题"});
    pb.addEventListener("click",function(){pb.disabled=true;Speech.speak(fa.q,{rate:0.9}).then(function(){pb.disabled=false;pb.textContent="▶ 重听";});});
    blk.appendChild(pb);
    var b=el("button",{className:"smallBtn mt8",text:"🎤 口述回答"});
    b.addEventListener("click",function(){
      b.disabled=true;b.textContent="识别中...";
      STT.listen(12000).then(function(t){
        var s=scoreAnswer(t,fa.a);
        aScores.push(s.score);
        var pct2=Math.round(s.matchRatio);
        var g2=scoreGrade(pct2);
        b.textContent="✓ "+s.score+"/2分 ("+g2.label+")";
        b.style.background=g2.color;b.style.color="#fff";
        blk.appendChild(el("div",{className:"transcript mt8",text:"识别："+t}));
        blk.appendChild(el("div",{className:"muted mt8",text:"参考答案："+fa.a}));
        var nextBtn=el("button",{className:"primary mt8",text:ai<4?"下一答 →":"查看结果 →"});
        nextBtn.addEventListener("click",function(){ai++;showAnswers();});
        blk.appendChild(nextBtn);
        blk.scrollIntoView({behavior:"smooth"});
      }).catch(function(e){b.disabled=false;b.textContent="🎤 重新口述";toast("识别失败，请重试");});
    });
    blk.appendChild(b);
    root.appendChild(box);
  }
  showScenario();
}

function doSearch(q,wrap){
  if(!q||!q.trim()){toast("请输入搜索关键词");return;}
  var ql=q.toLowerCase().trim();
  var results=[];
  DATA.partA.forEach(function(d){if(d.title.toLowerCase().includes(ql)||d.topic.toLowerCase().includes(ql)||d.text.toLowerCase().includes(ql))results.push({part:"A",item:d});});
  DATA.partB.forEach(function(d){if(d.title.toLowerCase().includes(ql)||d.topic.toLowerCase().includes(ql)||d.scenario.toLowerCase().includes(ql))results.push({part:"B",item:d});});
  DATA.partC.forEach(function(d){if(d.title.toLowerCase().includes(ql)||d.topic.toLowerCase().includes(ql)||d.summary.toLowerCase().includes(ql))results.push({part:"C",item:d});});

  var old=$("#searchResults");if(old)old.remove();

        else if(r.part==="C")startPartC(item);
      });

    });

      var data=DATA["part"+s.part].filter(function(d){return d.id===s.id;})[0];
      rSec.appendChild(el("div",{className:"row"},[
        el("div",{className:"rl",text:"Part "+s.part+" · "+(data?data.title:"已删除")}),
        el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},[
          el("span",{style:{fontWeight:"700",color:g.color},text:s.score+"/"+s.max}),
          el("span",{className:"scoreGrade "+g.level,text:g.label})
        ])
      ]));
    });
    wrap.appendChild(rSec);
  }

  /* 版本更新（照搬原软件 cloudUpdateSection） */
  var upd=el("div",{className:"cloudUpdateSection"});
  upd.appendChild(el("div",{className:"updateHeader"},[el("h3",{text:"🔄 版本更新"}),el("span",{className:"versionBadge",text:"v"+APP_VERSION})]));
  upd.appendChild(el("p",{className:"muted",text:"点击检查更新，获取最新功能和练习资源。更新不会丢失任何个人数据。"}));
  var checkBtn=el("button",{className:"primary"});
  if(State.updateChecking){checkBtn.textContent="检查中...";checkBtn.disabled=true;}
  else{checkBtn.textContent="检查更新";}
  checkBtn.addEventListener("click",function(){checkUpdate(false);});
  upd.appendChild(el("div",{className:"updateActions"},[checkBtn]));
  if(State.updateInfo){
    var ui=State.updateInfo;
    var infoBox=el("div",{className:"updateInfoBox"});
    if(ui.hasUpdate){
      infoBox.appendChild(el("p",{className:"updateNewVersion",text:"发现新版本 v"+ui.version}));
      infoBox.appendChild(el("pre",{className:"updateLog",text:ui.changelog||ui.updateLog||""}));
      var updBtn=el("button",{className:"primary mt8",text:"立即更新"});
      updBtn.addEventListener("click",doUpdate);
      infoBox.appendChild(updBtn);
    }else{
      infoBox.appendChild(el("p",{className:"updateLatest",text:"已是最新版本"}));
    }
    upd.appendChild(infoBox);
  }
  if(State.updateStatus)upd.appendChild(el("p",{className:"status",text:State.updateStatus}));
  wrap.appendChild(upd);

  /* 网络修复更新（照搬原软件） */
  if(State.updateError){
    wrap.appendChild(el("div",{className:"cloudUpdateSection",style:{background:"#fef3c7",borderColor:"#fde68a"}},[
      el("h3",{style:{color:"#92400e"},text:"📱 网络修复更新"}),
      el("p",{className:"muted",text:"APP内网络检测失败，点击下方按钮在浏览器中打开更新页面。"}),
      (function(){var b=el("button",{className:"primary",style:{background:"#f59e0b"},text:"在浏览器中更新"});b.addEventListener("click",function(){window.open(OFFICIAL_SITE,"_blank");});return b;})()
    ]));
  }

  /* 反馈建议（照搬原软件：QQ） */
  var fbSec=el("div",{className:"feedbackSec"});
  fbSec.appendChild(el("h3",{text:"💬 反馈建议"}));
  fbSec.appendChild(el("p",{className:"muted",text:"有什么建议或遇到问题？欢迎添加QQ好友直接反馈，沟通更高效。"}));
  var fbRow=el("div",{style:{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}});
  fbRow.appendChild(el("span",{style:{fontSize:18,fontWeight:700,color:"#92400e"},text:"QQ: "+FEEDBACK_QQ}));
  var addQqBtn=el("button",{className:"primary",style:{background:"#f59e0b"},text:"添加QQ好友"});
  addQqBtn.addEventListener("click",function(){window.open(FEEDBACK_QQ_API,"_blank");try{navigator.clipboard&&navigator.clipboard.writeText(FEEDBACK_QQ);}catch(e){}});
  fbRow.appendChild(addQqBtn);
  var copyBtn=el("button",{className:"smallBtn",text:"复制QQ号"});
  copyBtn.addEventListener("click",function(){try{navigator.clipboard&&navigator.clipboard.writeText(FEEDBACK_QQ);alert("QQ号已复制："+FEEDBACK_QQ);}catch(e){alert("QQ号："+FEEDBACK_QQ);}});
  fbRow.appendChild(copyBtn);
  fbSec.appendChild(fbRow);
  wrap.appendChild(fbSec);

  /* 数据管理 */
  var dmSec=el("div",{className:"section"});
  dmSec.appendChild(el("h3",{text:"💾 数据管理"}));
  var bkBtn=el("button",{className:"smallBtn",text:"📤 备份"});
  bkBtn.addEventListener("click",backupData);
  dmSec.appendChild(el("div",{className:"row"},[el("span",{className:"rl",text:"备份练习数据"}),bkBtn]));
  var rsBtn=el("button",{className:"smallBtn",text:"📥 恢复"});
  rsBtn.addEventListener("click",restoreData);
  dmSec.appendChild(el("div",{className:"row"},[el("span",{className:"rl",text:"恢复练习数据"}),rsBtn]));
  var clrBtn2=el("button",{className:"smallBtn dangerGhost",text:"清除"});
  clrBtn2.addEventListener("click",function(){if(confirm("确定清除所有练习记录？此操作不可撤销。")){localStorage.removeItem(LSC.progress);localStorage.removeItem(LSC.scores);localStorage.removeItem(LSC.errors);State.progress={done:{},scores:{}};State.scores=[];toast("已清除所有记录");render();}});
  dmSec.appendChild(el("div",{className:"row"},[el("span",{className:"rl",text:"清除所有记录"}),clrBtn2]));
  wrap.appendChild(dmSec);

  /* 隐私 & 官网 */
  wrap.appendChild(el("div",{className:"cloudUpdateSection",style:{background:"#f0fdf4",borderColor:"#bbf7d0"}},[
    el("h3",{style:{color:"#166534"},text:"📋 隐私政策"}),
    el("p",{className:"muted",text:"本应用不收集任何用户个人信息，所有数据保存在设备本地。"}),
    (function(){var b=el("button",{className:"smallBtn",text:"查看隐私政策"});b.addEventListener("click",function(){window.open(PRIVACY_URL,"_blank");});return b;})()
  ]));
  wrap.appendChild(el("div",{className:"cloudUpdateSection",style:{background:"#eff6ff",borderColor:"#bfdbfe"}},[
    el("h3",{style:{color:"#1d4ed8"},text:"🌐 官网"}),
    el("p",{className:"muted",text:OFFICIAL_SITE}),
    (function(){var b=el("button",{className:"smallBtn",text:"访问官网"});b.addEventListener("click",function(){if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser){window.Capacitor.Plugins.Browser.open({url:OFFICIAL_SITE});}else{window.open(OFFICIAL_SITE,"_blank");}});return b;})()
  ]));
  wrap.appendChild(el("p",{className:"center muted mt12",text:"广东高考英语听说练习 · 仅供学习练习使用"}));
  return wrap;
}

function chartBar(val,max){
  var track=el("div",{className:"cbTrack"});
  if(val!=null&&max){
    var pct=Math.round(val/max*100);
    var g=scoreGrade(pct);
    var fill=el("div",{className:"cbFill"});
    fill.style.width=Math.min(100,pct)+"%";
    fill.style.background=g.color;
    fill.textContent=pct+"%";
    track.appendChild(fill);
  }
  return track;
}

function backupData(){
  var data={progress:State.progress,scores:State.scores,errors:getErrors(),version:APP_VERSION};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="gaokao-listening-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  toast("数据已备份");
}
function restoreData(){
  var inp=el("input",{type:"file",accept:".json"});
  inp.addEventListener("change",function(){
    var f=inp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(d.progress){State.progress=d.progress;save(LSC.progress,State.progress);}
        if(d.scores){State.scores=d.scores;save(LSC.scores,State.scores);}
        if(d.errors){save(LSC.errors,d.errors);}
        toast("数据已恢复");
        render();
      }catch(e){toast("恢复失败：文件格式错误");}
    };
    rd.readAsText(f);
  });
  inp.click();
}

/* =========================================================================
   更新检查（照搬原软件逻辑）
   ========================================================================= */
function checkUpdate(silent){
  State.updateChecking=true;State.updateError=false;State.updateStatus=silent?"":"正在检查更新...";render();
  // 1) GitHub Pages
  function tryGhPages(){
    var url=UPDATE_URL_GHPAGES+"?_t="+Date.now();
    console.log("[Update] Trying GitHub Pages:",url);
    return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("GitHub Pages HTTP "+r.status);return r.json();});
  }
  // 2) jsdelivr CDN
  function tryJsdelivr(){
    var url=UPDATE_URL_JSDELIVR+"&_t="+Date.now();
    console.log("[Update] Trying jsdelivr CDN:",url);
    return fetch(url,{cache:"no-store",headers:{Accept:"application/json, text/plain, */*"}}).then(function(r){if(!r.ok)throw Error("jsdelivr HTTP "+r.status);return r.json();});
  }
  // 3) raw (gitee)
  function tryRaw(){
    var url=UPDATE_URL_RAW+"?_t="+Date.now();
    console.log("[Update] Trying raw:",url);
    return fetch(url,{cache:"no-store",redirect:"follow",headers:{Accept:"application/json, text/plain, */*"}}).then(function(r){if(!r.ok)throw Error("raw HTTP "+r.status);return r.json();});
  }
  // 4) API fallback（base64 解码，照搬原软件）
  function tryApi(){
    var url=UPDATE_URL_API+"?_t="+Date.now();
    console.log("[Update] Trying API:",url);
    return fetch(url,{cache:"no-store",headers:{Accept:"application/json, text/plain, */*","Accept-Language":"zh-CN,zh;q=0.9"}}).then(function(r){if(!r.ok)throw Error("API HTTP "+r.status);return r.json();}).then(function(n){
      if(n.content&&n.encoding==="base64"){return JSON.parse(decodeURIComponent(escape(atob(n.content))));}
      else if(n.versionCode)return n;
      throw Error("API 数据格式无法识别");
    });
  }
  var remote=null;
  tryGhPages().catch(function(e){console.warn("[Update] GitHub Pages failed:",e.message);return tryJsdelivr();})
  .catch(function(e){console.warn("[Update] jsdelivr failed:",e.message);return tryRaw();})
  .catch(function(e){console.warn("[Update] raw failed:",e.message);return tryApi();})
  .catch(function(e){console.warn("[Update] All fallbacks failed");throw Error("检查更新失败，请检查网络连接后重试");})
  .then(function(r){
    remote=r;
    if(typeof remote.versionCode!=="number")throw Error("versionCode 无效: "+remote.versionCode);
    console.log("[Update] Local versionCode:",APP_VERSION_CODE,"Remote:",remote.versionCode);
    var hasUpdate=remote.versionCode>APP_VERSION_CODE;
    var changelog=remote.changelog||remote.updateLog||"";
    var ver=remote.version||remote.versionCode;
    var apkUrl=remote.apkUrl||remote.appUrl||"";
    State.updateInfo={hasUpdate:hasUpdate,version:ver,versionCode:remote.versionCode,updateLog:changelog,changelog:changelog,apkUrl:apkUrl,appUrl:apkUrl,updating:false};
    if(!silent)State.updateStatus=hasUpdate?("发现新版本 v"+ver):"已是最新版本";
    // 公告弹窗（照搬原软件：版本变化且未忽略过）
    if(silent&&hasUpdate){
      var dismissed=load(LSC.dismissed,"");
      if(String(ver)!==String(dismissed)){
        State.announce={version:ver,changelog:changelog};
      }
    }
    // 网页版静默更新（照搬原软件：document.write 替换页面）
    if(silent&&hasUpdate&&remote.webHtmlUrl){
      fetch(remote.webHtmlUrl).then(function(e){return e.text();}).then(function(t){
        if(t&&(t.includes("<!doctype")||t.includes("<html"))){
          console.log("[Update] 网页版静默更新：替换页面内容");
          document.open();document.write(t);document.close();return;
        }
      }).catch(function(e){console.warn("[Update] 网页版更新失败:",e.message);});
    }
    State.updateChecking=false;render();
  })
  .catch(function(e){
    console.error("[Update] Error:",e);
    State.updateChecking=false;State.updateError=true;
    if(!silent)State.updateStatus="检查失败："+e.message;
    State.updateInfo=null;render();
  });
}
// 立即更新（照搬原软件 $n：多镜像 + 原生Filesystem / 浏览器打开）
function doUpdate(){
  if(!State.updateInfo||!State.updateInfo.hasUpdate)return;
  State.updateInfo.updating=true;State.updateStatus="正在打开下载页面...";render();
  var info=State.updateInfo;
  var apkUrl=info.apkUrl||info.appUrl||(APK_MIRRORS[0]&&APK_MIRRORS[0].url);
  // 优先网页版（若有 webHtmlUrl 则已是静默更新）；否则打开下载
  if(apkUrl){
    if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser){
      window.Capacitor.Plugins.Browser.open({url:apkUrl});
    }else{
      window.open(apkUrl,"_blank");
    }
    toast("已打开下载页面");
  }else if(WEB_HTML_URL){
    window.open(WEB_HTML_URL,"_blank");
  }
}
function renderUpdateOverlay(){
  var old=$("#__updOverlay");if(old)old.remove();
  if(!State.announce)return;
  var a=State.announce;
  var ov=el("div",{id:"__updOverlay",className:"updateOverlay"});
  ov.addEventListener("click",function(e){if(e.target===e.currentTarget)closeAnnounce();});
  var modal=el("div",{className:"updateModal"});
  var hdr=el("div",{className:"updateModalHeader"});
  hdr.appendChild(el("div",{className:"updateModalIcon",text:"🚀"}));
  hdr.appendChild(el("p",{className:"updateModalTitle",text:"发现新版本"}));
  hdr.appendChild(el("p",{className:"updateModalSub",text:"快来体验最新功能吧"}));
  var ver=el("div",{className:"updateModalVersion"});
  ver.appendChild(el("span",{text:"v"+a.version}));
  ver.appendChild(el("span",{className:"updateModalBadge",text:"NEW"}));
  hdr.appendChild(ver);
  modal.appendChild(hdr);
  var body=el("div",{className:"updateModalBody"});
  body.appendChild(el("h4",{text:"更新内容"}));
  var ul=el("ul",{className:"updateModalList"});
  (a.changelog||"").split("\n").filter(function(l){return l.trim()&&!l.trim().startsWith("v")&&!l.trim().startsWith("【");}).forEach(function(l){
    var li=el("li",{});
    li.appendChild(el("span",{className:"updateModalDot"}));
    li.appendChild(el("span",{text:l.trim().replace(/^[-\d.]+\s*/,"")}));
    ul.appendChild(li);
  });
  if(!ul.children.length){
    var li2=el("li",{});
    li2.appendChild(el("span",{className:"updateModalDot"}));
    li2.appendChild(el("span",{text:"功能优化与问题修复"}));
    ul.appendChild(li2);
  }
  body.appendChild(ul);
  modal.appendChild(body);
  var footer=el("div",{className:"updateModalFooter"});
  var ghost=el("button",{className:"updateBtnGhost",text:"下次再说"});
  ghost.addEventListener("click",function(){save(LSC.dismissed,a.version);closeAnnounce();});
  footer.appendChild(ghost);
  var primary=el("button",{className:"updateBtnPrimary",text:"立即更新"});
  primary.addEventListener("click",function(){
    closeAnnounce();
    var url=(APK_MIRRORS[0]&&APK_MIRRORS[0].url)||WEB_HTML_URL;
    if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser){window.Capacitor.Plugins.Browser.open({url:url});}else{window.open(url,"_blank");}
  });
  footer.appendChild(primary);
  modal.appendChild(footer);
  ov.appendChild(modal);document.body.appendChild(ov);
}
function closeAnnounce(){State.announce=null;var o=$("#__updOverlay");if(o)o.remove();}

/* ---------- 初始化 ---------- */
function init(){
  render();
  // 启动后静默检查更新（照搬原软件行为）
  setTimeout(function(){try{checkUpdate(true);}catch(e){console.warn(e);}},1500);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();

console.log("[App] version",APP_VERSION,"code",APP_VERSION_CODE);
window.__APP={APP_VERSION:APP_VERSION,APP_VERSION_CODE:APP_VERSION_CODE};
})();
</script>
